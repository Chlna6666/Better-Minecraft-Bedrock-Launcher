name: Commit validated legacy UWP isolation result

on:
  push:
    branches:
      - ci/legacy-uwp-1.18.30-no-bloader
    paths:
      - tools/commit-legacy-uwp-isolation.trigger

permissions:
  contents: write

jobs:
  commit-result:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/legacy-uwp-1.18.30-no-bloader
          fetch-depth: 0

      - name: Apply already validated patch
        shell: pwsh
        run: |
          python tools/apply-legacy-uwp-bloader-isolation.py
          rustfmt --edition 2024 src/core/minecraft/launcher/task.rs
          git diff --check

      - name: Commit clean product result
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          Remove-Item -Force tools/apply-legacy-uwp-bloader-isolation.py
          Remove-Item -Force .github/workflows/apply-legacy-uwp-bloader-isolation.yml
          Remove-Item -Force .github/workflows/commit-legacy-uwp-isolation-result.yml
          Remove-Item -Force tools/commit-legacy-uwp-isolation.trigger
          git add -A
          git commit -m "fix(launcher): isolate BLoader from Minecraft 1.18.30 UWP"
          git push origin HEAD:ci/legacy-uwp-1.18.30-no-bloader
