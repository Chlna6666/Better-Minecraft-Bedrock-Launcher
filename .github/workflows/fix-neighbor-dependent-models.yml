name: Fix neighbor dependent models

on:
  push:
    branches: [master]
    paths:
      - scripts/fix_neighbor_dependent_models.py
      - scripts/bootstrap_neighbor_model_patch.py
      - scripts/fix_neighbor_model_precedence.py
      - .github/workflows/fix-neighbor-dependent-models.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-neighbor-dependent-models
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake libclang-dev llvm-dev ninja-build pkg-config \
            libasound2-dev libdbus-1-dev libegl1-mesa-dev libfontconfig1-dev \
            libfreetype6-dev libgl1-mesa-dev libpipewire-0.3-dev libssl-dev \
            libudev-dev libvulkan-dev libwayland-dev libx11-dev libx11-xcb-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb1-dev \
            libxcursor-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxrandr-dev nasm yasm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Apply neighbor model patch
        run: |
          python3 scripts/bootstrap_neighbor_model_patch.py
          python3 scripts/fix_neighbor_dependent_models.py
          python3 scripts/fix_neighbor_model_precedence.py

      - name: Format
        run: |
          cargo fmt --all
          git diff --check

      - name: Test block model crate
        run: cargo test -p bedrock-block-model

      - name: Check block model and world crates
        run: cargo check -p bedrock-block-model -p bedrock-world --all-features

      - name: Check BMCBL library
        shell: bash
        run: |
          set -o pipefail
          cargo check --lib 2>&1 | tee cargo-check.log

      - name: Upload BMCBL check diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neighbor-model-cargo-check
          path: cargo-check.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Commit verified source changes
        shell: bash
        run: |
          rm -f scripts/fix_neighbor_dependent_models.py
          rm -f scripts/bootstrap_neighbor_model_patch.py
          rm -f scripts/fix_neighbor_model_precedence.py
          rm -f .github/workflows/fix-neighbor-dependent-models.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(方块模型): 修复邻接方块与方块实体模型"
          git push origin HEAD:master
