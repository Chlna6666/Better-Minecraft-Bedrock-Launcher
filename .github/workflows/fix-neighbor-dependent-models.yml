name: Fix neighbor dependent models

on:
  push:
    branches: [master]
    paths:
      - scripts/fix_neighbor_dependent_models.py
      - scripts/bootstrap_neighbor_model_patch.py
      - scripts/fix_neighbor_model_precedence.py
      - scripts/fix_neighbor_preview_compile.py
      - .github/workflows/fix-neighbor-dependent-models.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-neighbor-dependent-models
  cancel-in-progress: false

jobs:
  model-core:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Apply neighbor model patch
        run: |
          python3 scripts/bootstrap_neighbor_model_patch.py
          python3 scripts/fix_neighbor_dependent_models.py
          python3 scripts/fix_neighbor_model_precedence.py
          python3 scripts/fix_neighbor_preview_compile.py

      - name: Format
        run: |
          cargo fmt --all
          git diff --check

      - name: Test block model crate
        run: cargo test -p bedrock-block-model

      - name: Check block model and world crates
        run: cargo check -p bedrock-block-model -p bedrock-world --all-features

  bmcbl-windows:
    if: github.actor != 'github-actions[bot]'
    needs: model-core
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Apply neighbor model patch
        shell: pwsh
        run: |
          python scripts/bootstrap_neighbor_model_patch.py
          python scripts/fix_neighbor_dependent_models.py
          python scripts/fix_neighbor_model_precedence.py
          python scripts/fix_neighbor_preview_compile.py

      - name: Format
        shell: pwsh
        run: |
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check BMCBL library
        shell: pwsh
        run: |
          cmd /c "cargo check --lib > cargo-check.log 2>&1"
          $cargoExit = $LASTEXITCODE
          Get-Content cargo-check.log
          if ($cargoExit -ne 0) { exit $cargoExit }

      - name: Upload BMCBL check diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neighbor-model-cargo-check-windows
          path: cargo-check.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Commit verified source changes
        shell: pwsh
        run: |
          git fetch origin master
          $remoteHead = (git rev-parse origin/master).Trim()
          if ($remoteHead -ne $env:GITHUB_SHA) {
            throw "master advanced during validation: $remoteHead != $env:GITHUB_SHA"
          }

          Remove-Item -Force scripts/fix_neighbor_dependent_models.py -ErrorAction SilentlyContinue
          Remove-Item -Force scripts/bootstrap_neighbor_model_patch.py -ErrorAction SilentlyContinue
          Remove-Item -Force scripts/fix_neighbor_model_precedence.py -ErrorAction SilentlyContinue
          Remove-Item -Force scripts/fix_neighbor_preview_compile.py -ErrorAction SilentlyContinue
          Remove-Item -Force .github/workflows/fix-neighbor-dependent-models.yml -ErrorAction SilentlyContinue
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No changes to commit"
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(方块模型): 修复邻接方块与方块实体模型"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:master
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
