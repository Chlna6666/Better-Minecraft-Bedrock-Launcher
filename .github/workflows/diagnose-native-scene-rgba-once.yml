name: Diagnose native scene RGBA refactor once

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  diagnose:
    if: github.event.issue.title == '[internal] diagnose native scene RGBA refactor once'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Apply patch and report validation output
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        shell: bash
        run: |
          set +e
          {
            set -euo pipefail
            python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-native-scene-rgba-once.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Validate Rust and shader changes"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          Path('/tmp/apply_native_scene_rgba.py').write_text(
              textwrap.dedent(workflow[start:end]), encoding='utf-8'
          )
          PY
            python3 /tmp/apply_native_scene_rgba.py
            git diff --check
            cargo check -p gpui --all-targets --features build-shader-validation
          } > >(tee /tmp/native-rgba-diagnostic.log) 2>&1
          status=$?
          {
            echo "Diagnostic exit status: $status"
            echo
            echo '```text'
            tail -c 60000 /tmp/native-rgba-diagnostic.log
            echo '```'
          } > /tmp/native-rgba-diagnostic.md
          gh issue comment "$ISSUE_URL" --body-file /tmp/native-rgba-diagnostic.md
          exit 0
