name: Apply custom mesh texture binding v3

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/apply-custom-mesh-texture-binding-v3-20260905.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply source patch
        shell: bash
        run: |
          python .github/scripts/fix_custom_mesh_texture_patcher_20260905.py
          python .github/scripts/fix_custom_mesh_texture_patcher_v2_20260905.py
          python .github/scripts/apply_custom_mesh_texture_binding_20260905.py

      - name: Format
        shell: bash
        run: cargo fmt --all -- --check

      - name: Check GPUI Nova
        shell: bash
        run: cargo check -p gpui --features nova-gfx-dx12,nova-gfx-vulkan,build-shader-validation

      - name: Clippy GPUI Nova
        shell: bash
        run: cargo clippy -p gpui --features nova-gfx-dx12,nova-gfx-vulkan,build-shader-validation --all-targets -- -D warnings

      - name: Commit validated framework change
        shell: bash
        run: |
          rm .github/scripts/apply_custom_mesh_texture_binding_20260905.py
          rm .github/scripts/fix_custom_mesh_texture_patcher_20260905.py
          rm .github/scripts/fix_custom_mesh_texture_patcher_v2_20260905.py
          rm .github/workflows/apply-custom-mesh-texture-binding-20260905.yml
          rm .github/workflows/apply-custom-mesh-texture-binding-v2-20260905.yml
          rm .github/workflows/apply-custom-mesh-texture-binding-v3-20260905.yml
          git config user.name "Chlna6666"
          git config user.email "79357769+Chlna6666@users.noreply.github.com"
          git add crates/gpui/src .github/scripts/apply_custom_mesh_texture_binding_20260905.py .github/scripts/fix_custom_mesh_texture_patcher_20260905.py .github/scripts/fix_custom_mesh_texture_patcher_v2_20260905.py .github/workflows/apply-custom-mesh-texture-binding-20260905.yml .github/workflows/apply-custom-mesh-texture-binding-v2-20260905.yml .github/workflows/apply-custom-mesh-texture-binding-v3-20260905.yml
          git commit -m "feat(gpui): 支持运行时着色器采样纹理"
          git push origin HEAD:master
