name: Apply GPUI color conversion fix from workflow completion

on:
  workflow_run:
    workflows:
      - "Apply Linux raw-window-handle fix"
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: apply-gpui-color-const-fix-once
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.workflow_run.id == 29842972851
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Extract and apply staged source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-gpui-color-const-fix-once.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Commit implementation directly to master"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          Path('/tmp/apply_gpui_color_fix.py').write_text(script, encoding='utf-8')
          PY
          python3 /tmp/apply_gpui_color_fix.py

      - name: Commit implementation directly to master
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-gpui-color-const-fix-once.yml
          rm -f .github/workflows/apply-gpui-color-const-fix-workflow-run-once.yml
          rm -f tools/.gpui-color-fix-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: support const RGBA to HSLA colors"
          git push origin HEAD:master
