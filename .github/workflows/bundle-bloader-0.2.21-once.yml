name: Bundle BLoader 0.2.21 once

on:
  push:
    branches:
      - ci/bundle-bloader-0.2.21

permissions:
  contents: write

jobs:
  bundle:
    runs-on: windows-2025
    steps:
      - name: Checkout trigger branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reset product tree to current master
        shell: pwsh
        run: |
          git fetch origin master
          git reset --hard origin/master
          $expected = "da580ab3ef284c0fe548a96d14d10694a3a689fc"
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $expected) {
            throw "BMCBL master moved: expected $expected, got $actual"
          }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build verified BLoader 0.2.21
        shell: pwsh
        run: |
          $src = "D:\a\BLoader\BLoader"
          New-Item -ItemType Directory -Path (Split-Path $src) -Force | Out-Null
          git clone https://github.com/Chlna6666/BLoader.git $src
          Push-Location $src
          git checkout --detach ea24938c63b4ada64ea72a9082c4bd19e975f0bc
          cargo build --release --lib --target x86_64-pc-windows-msvc
          $dll = Join-Path $src "target\x86_64-pc-windows-msvc\release\BLoader.dll"
          if (-not (Test-Path $dll)) { throw "BLoader.dll was not produced" }
          $actualHash = (Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedHash = "f074841778334742e45a728ef1fd6242f3353210740e93c9dced1c64dedfe202"
          Write-Host "BLoader.dll SHA256=$actualHash"
          if ($actualHash -ne $expectedHash) {
            throw "BLoader.dll hash mismatch: expected $expectedHash, got $actualHash"
          }
          Pop-Location
          Copy-Item $dll "assets\bin\BLoader.dll" -Force

      - name: Verify bundled binary
        shell: pwsh
        run: |
          $hash = (Get-FileHash "assets\bin\BLoader.dll" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "f074841778334742e45a728ef1fd6242f3353210740e93c9dced1c64dedfe202") {
            throw "Bundled DLL hash changed unexpectedly: $hash"
          }
          Write-Host "Verified assets/bin/BLoader.dll SHA256=$hash"

      - name: Commit clean binary-only result
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/bin/BLoader.dll
          $changed = git diff --cached --name-only
          if (($changed | Measure-Object).Count -ne 1 -or $changed -ne "assets/bin/BLoader.dll") {
            throw "Unexpected staged files: $changed"
          }
          git commit -m "chore: bundle BLoader 0.2.21"
          git push --force origin HEAD:refs/heads/ci/bundle-bloader-0.2.21-result
