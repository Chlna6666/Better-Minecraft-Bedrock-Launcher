name: Bundle BLoader 0.2.21 once

on:
  push:
    branches:
      - ci/bundle-bloader-0.2.21
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  bundle:
    if: github.event_name == 'push' || github.head_ref == 'ci/bundle-bloader-0.2.21'
    runs-on: windows-2025
    steps:
      - name: Checkout trigger branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reset product tree to current master
        shell: pwsh
        run: |
          git fetch origin master
          git reset --hard origin/master
          $expected = "da580ab3ef284c0fe548a96d14d10694a3a689fc"
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $expected) {
            throw "BMCBL master moved: expected $expected, got $actual"
          }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Test and build exact BLoader 0.2.21 source
        shell: pwsh
        run: |
          $src = "D:\a\BLoader\BLoader"
          if (Test-Path $src) { Remove-Item $src -Recurse -Force }
          New-Item -ItemType Directory -Path (Split-Path $src) -Force | Out-Null
          git clone https://github.com/Chlna6666/BLoader.git $src
          Push-Location $src
          git checkout --detach ea24938c63b4ada64ea72a9082c4bd19e975f0bc
          $sourceCommit = (git rev-parse HEAD).Trim()
          if ($sourceCommit -ne "ea24938c63b4ada64ea72a9082c4bd19e975f0bc") {
            throw "Unexpected BLoader source commit: $sourceCommit"
          }
          cargo test --lib --target x86_64-pc-windows-msvc
          cargo build --release --lib --target x86_64-pc-windows-msvc
          $dll = Join-Path $src "target\x86_64-pc-windows-msvc\release\BLoader.dll"
          if (-not (Test-Path $dll)) { throw "BLoader.dll was not produced" }
          $size = (Get-Item $dll).Length
          if ($size -lt 65536) { throw "BLoader.dll is unexpectedly small: $size" }
          $hash = (Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Validated BLoader source=$sourceCommit"
          Write-Host "Validated BLoader.dll size=$size SHA256=$hash"
          Pop-Location
          Copy-Item $dll "assets\bin\BLoader.dll" -Force

      - name: Verify bundled binary copy
        shell: pwsh
        run: |
          $hash = (Get-FileHash "assets\bin\BLoader.dll" -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item "assets\bin\BLoader.dll").Length
          if ($size -lt 65536) { throw "Bundled BLoader.dll is unexpectedly small: $size" }
          Write-Host "Bundled assets/bin/BLoader.dll size=$size SHA256=$hash"

      - name: Commit clean binary-only result
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/bin/BLoader.dll
          $changed = @(git diff --cached --name-only)
          if ($changed.Count -ne 1 -or $changed[0] -ne "assets/bin/BLoader.dll") {
            throw "Unexpected staged files: $($changed -join ', ')"
          }
          git commit -m "chore: bundle BLoader 0.2.21"
          git push --force origin HEAD:refs/heads/ci/bundle-bloader-0.2.21-result
