name: Apply GPUI retained replay order fix

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/apply-gpui-replay-order-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply replay-order fix
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/gpui/src/scene/display_list.rs")
          text = path.read_text(encoding="utf-8")

          fn_start = text.index("    fn replay_primitive(&mut self, primitive: &Primitive, retain_order: bool) {")
          fn_end = text.index("    fn push_replayed_primitive(", fn_start)
          new_fn = "\n".join([
              "    fn replay_primitive(&mut self, primitive: &Primitive, retain_order: bool) {",
              "        // A retained-order proof belongs to the exact ordering prefix that produced it.",
              "        // If an enclosing layer was rebuilt with a different DrawOrder, keeping the",
              "        // primitive's old order would mix two frame-local ordering domains. Rebind to",
              "        // the current layer and invalidate the remainder of this retained prefix.",
              "        let retain_order = retain_order && !self.retained_prefix_invalid;",
              "        let order = if retain_order {",
              "            let clipped_bounds = primitive",
              "                .bounds()",
              "                .intersect(&primitive.content_mask().bounds);",
              "            if clipped_bounds.is_empty() {",
              "                return;",
              "            }",
              "            if let Some(layer_order) = self.layer_stack.last().copied() {",
              "                if layer_order != primitive.order() {",
              "                    self.retained_prefix_invalid = true;",
              "                }",
              "                layer_order",
              "            } else {",
              "                self.primitive_bounds",
              "                    .insert_with_order(clipped_bounds, primitive.order())",
              "            }",
              "        } else if let Some(order) = self.order_for_primitive(primitive) {",
              "            order",
              "        } else {",
              "            return;",
              "        };",
              "        self.replayed_primitives = self.replayed_primitives.saturating_add(1);",
              "        let primitive_kind = self.push_replayed_primitive(primitive, order);",
              "        let mut primitive = primitive.clone();",
              "        primitive.set_order(order);",
              "        if let (ScenePrimitiveKind::Path, Primitive::Path(path)) =",
              "            (primitive_kind, &mut primitive)",
              "        {",
              "            path.id = PathId(self.paths.len().saturating_sub(1));",
              "        }",
              "        self.paint_operations",
              "            .push(PaintOperation::Primitive(primitive));",
              "    }",
              "",
          ])
          text = text[:fn_start] + new_fn + text[fn_end:]

          replay_start = text.index("    pub fn replay(&mut self, range: Range<usize>, prev_scene: &Scene) {")
          branch_start = text.index("                PaintOperation::Primitive(primitive) => {", replay_start)
          branch_end = text.index("                PaintOperation::StartLayer(bounds) => {", branch_start)
          new_branch = "\n".join([
              "                PaintOperation::Primitive(primitive) => {",
              "                    if self.blur_captures.last().is_some() {",
              "                        let (captured_primitive, capture_prefix_invalid) = {",
              "                            let capture = self.blur_captures.last_mut().unwrap();",
              "                            let operation_start = capture.scene.paint_operations.len();",
              "                            capture.scene.replay_primitive(primitive, retain_order);",
              "                            let captured_primitive = capture",
              "                                .scene",
              "                                .paint_operations",
              "                                .get(operation_start)",
              "                                .and_then(|operation| match operation {",
              "                                    PaintOperation::Primitive(primitive) => {",
              "                                        Some(primitive.clone())",
              "                                    }",
              "                                    PaintOperation::StartLayer(_)",
              "                                    | PaintOperation::EndLayer",
              "                                    | PaintOperation::StartBlur(_)",
              "                                    | PaintOperation::EndBlur => None,",
              "                                });",
              "                            (captured_primitive, capture.scene.retained_prefix_invalid)",
              "                        };",
              "                        if capture_prefix_invalid {",
              "                            self.retained_prefix_invalid = true;",
              "                        }",
              "                        if let Some(primitive) = captured_primitive {",
              "                            self.paint_operations",
              "                                .push(PaintOperation::Primitive(primitive));",
              "                        }",
              "                    } else {",
              "                        self.replay_primitive(primitive, retain_order);",
              "                    }",
              "                }",
          ]) + "\n"
          text = text[:branch_start] + new_branch + text[branch_end:]

          final_start = text.index("        if retain_order && self.paint_operations.len() == range_end {", replay_start)
          final_end = text.index("    fn ordering_prefix_matches_previous", final_start)
          new_final = "\n".join([
              "        if retain_order",
              "            && !self.retained_prefix_invalid",
              "            && self.paint_operations.len() == range_end",
              "        {",
              "            self.retained_prefix_verified_len = range_end;",
              "        } else if retain_order {",
              "            self.retained_prefix_invalid = true;",
              "        }",
              "    }",
              "",
              "",
          ])
          text = text[:final_start] + new_final + text[final_end:]

          if "debug_assert_eq!(layer_order, primitive.order())" in text:
              raise SystemExit("stale retained-order debug assertion remains")
          path.write_text(text, encoding="utf-8")

      - name: Format
        run: cargo fmt --all

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/gpui/src/scene/display_list.rs
          git diff --cached --check
          git diff --cached --quiet && {
            echo 'no replay-order fix generated' >&2
            exit 1
          }
          git commit -m 'fix(gpui): retained replay 重绑当前图层绘制顺序'
          git push origin HEAD:master
