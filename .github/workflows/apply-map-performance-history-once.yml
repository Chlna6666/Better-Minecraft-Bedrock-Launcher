name: Apply map performance and history visualization once

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/apply-map-performance-history-once.yml"

permissions:
  contents: write

concurrency:
  group: apply-map-performance-history-once
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Apply source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import zlib

          payload = Path("tools/apply_map_perf_history.py.zlib.b64").read_text(encoding="utf-8").strip()
          Path("/tmp/apply_map_perf_history.py").write_bytes(
              zlib.decompress(base64.b64decode(payload))
          )
          PY
          python3 /tmp/apply_map_perf_history.py

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/apply_map_perf_history.py.zlib.b64
          rm -f .github/workflows/apply-map-performance-history-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: optimize 3D preview and visualize edit history"
          git push origin HEAD:master
          git push origin --delete tmp-preview-3d-perf-apply || true
