name: Apply native scene RGBA refactor once

on:
  workflow_run:
    workflows:
      - "Apply Linux raw-window-handle fix"
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: apply-native-scene-rgba-once
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.workflow_run.id == 29842972851
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Apply native RGBA scene changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"expected exactly one match in {path}, found {count}: {old[:120]!r}"
                  )
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          def replace_count(path: str, old: str, new: str, expected: int) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(
                      f"expected {expected} matches in {path}, found {count}: {old[:120]!r}"
                  )
              file.write_text(text.replace(old, new), encoding="utf-8")

          # Background is the style/scene boundary. Public callers can still pass Hsla,
          # but the retained paint representation stores RGBA directly.
          path = "crates/gpui/src/foundation/color/background.rs"
          replace_once(path, "pub(crate) solid: Hsla,", "pub(crate) solid: Rgba,")
          replace_once(path, "solid: Hsla::default(),", "solid: Rgba::default(),")
          replace_once(
              path,
              "pub fn pattern_slash(color: Hsla, width: f32, interval: f32) -> Background {",
              "pub fn pattern_slash(color: impl Into<Rgba>, width: f32, interval: f32) -> Background {",
          )
          replace_once(
              path,
              """    Background {
                  tag: BackgroundTag::PatternSlash,
                  solid: color,
                  gradient_angle_or_pattern_height: height,
          """,
              """    Background {
                  tag: BackgroundTag::PatternSlash,
                  solid: color.into(),
                  gradient_angle_or_pattern_height: height,
          """,
          )
          replace_once(
              path,
              "pub fn solid_background(color: impl Into<Hsla>) -> Background {",
              "pub fn solid_background(color: impl Into<Rgba>) -> Background {",
          )
          replace_once(path, "pub color: Hsla,", "pub color: Rgba,")
          replace_once(
              path,
              "pub fn linear_color_stop(color: impl Into<Hsla>, percentage: f32) -> LinearColorStop {",
              "pub fn linear_color_stop(color: impl Into<Rgba>, percentage: f32) -> LinearColorStop {",
          )
          replace_once(
              path,
              """impl From<Hsla> for Background {
              fn from(value: Hsla) -> Self {
                  Background {
                      tag: BackgroundTag::Solid,
                      solid: value,
                      ..Default::default()
                  }
              }
          }
          """,
              """impl From<Hsla> for Background {
              fn from(value: Hsla) -> Self {
                  Background {
                      tag: BackgroundTag::Solid,
                      solid: value.into(),
                      ..Default::default()
                  }
              }
          }
          """,
          )
          replace_once(
              path,
              """impl From<Rgba> for Background {
              fn from(value: Rgba) -> Self {
                  Background {
                      tag: BackgroundTag::Solid,
                      solid: Hsla::from(value),
                      ..Default::default()
                  }
              }
          }
          """,
              """impl From<Rgba> for Background {
              fn from(value: Rgba) -> Self {
                  Background {
                      tag: BackgroundTag::Solid,
                      solid: value,
                      ..Default::default()
                  }
              }
          }
          """,
          )

          # Scene primitives retain RGBA. Hsla remains available for theme and backdrop-blur APIs.
          path = "crates/gpui/src/scene/primitive.rs"
          replace_once(
              path,
              "AtlasTile, Background, Bounds, ContentMask, Corners, Edges, Hsla, Pixels, ScaledPixels,",
              "AtlasTile, Background, Bounds, ContentMask, Corners, Edges, Hsla, Pixels, Rgba, ScaledPixels,",
          )
          replace_once(path, "pub border_color: Hsla,", "pub border_color: Rgba,")
          replace_once(path, "pub color: Hsla,\n    pub thickness: ScaledPixels,", "pub color: Rgba,\n    pub thickness: ScaledPixels,")
          replace_once(path, "pub color: Hsla,\n}\n\nimpl From<Shadow>", "pub color: Rgba,\n}\n\nimpl From<Shadow>")
          replace_once(path, "pub color: Hsla,\n    pub tile: AtlasTile,", "pub color: Rgba,\n    pub tile: AtlasTile,")

          # Convert theme/style Hsla once when paint commands enter the retained Scene.
          path = "crates/gpui/src/window/paint.rs"
          replace_once(path, "pub border_color: Hsla,", "pub border_color: Rgba,")
          replace_once(
              path,
              "pub fn border_color(self, border_color: impl Into<Hsla>) -> Self {",
              "pub fn border_color(self, border_color: impl Into<Rgba>) -> Self {",
          )
          replace_count(path, "border_color: impl Into<Hsla>,", "border_color: impl Into<Rgba>,", 2)
          replace_once(path, "border_color: transparent_black(),", "border_color: transparent_black().into(),")
          replace_once(path, "color: shadow.color.opacity(opacity),", "color: shadow.color.opacity(opacity).into(),")
          replace_once(
              path,
              "color: style.color.unwrap_or_default().opacity(element_opacity),",
              "color: style.color.unwrap_or_default().opacity(element_opacity).into(),",
          )
          replace_once(
              path,
              "color: style.color.unwrap_or_default().opacity(opacity),",
              "color: style.color.unwrap_or_default().opacity(opacity).into(),",
          )
          replace_once(path, "color: color.opacity(element_opacity),", "color: color.opacity(element_opacity).into(),")

          replace_once(
              "crates/gpui/src/window/paint_resources.rs",
              "color: color.opacity(element_opacity),",
              "color: color.opacity(element_opacity).into(),",
          )

          # Nova uploads raw RGBA components. Backdrop blur tint intentionally stays HSLA.
          path = "crates/gpui/src/platform/nova/upload_packing.rs"
          replace_once(path, "write_hsla(bytes, quad.border_color);", "write_rgba(bytes, quad.border_color);")
          replace_once(path, "write_hsla(bytes, shadow.color);", "write_rgba(bytes, shadow.color);")
          replace_once(path, "write_hsla(bytes, sprite.color);", "write_rgba(bytes, sprite.color);")
          replace_once(path, "write_hsla(bytes, underline.color);", "write_rgba(bytes, underline.color);")
          replace_once(path, "write_hsla(bytes, background.solid);", "write_rgba(bytes, background.solid);")
          replace_once(path, "write_hsla(bytes, stop.color);", "write_rgba(bytes, stop.color);")
          replace_once(
              path,
              """pub(super) fn write_hsla(bytes: &mut Vec<u8>, color: crate::Hsla) {
              write_f32_vec(bytes, color.h);
              write_f32_vec(bytes, color.s);
              write_f32_vec(bytes, color.l);
              write_f32_vec(bytes, color.a);
          }
          """,
              """pub(super) fn write_rgba(bytes: &mut Vec<u8>, color: crate::Rgba) {
              write_f32_vec(bytes, color.r);
              write_f32_vec(bytes, color.g);
              write_f32_vec(bytes, color.b);
              write_f32_vec(bytes, color.a);
          }

          pub(super) fn write_hsla(bytes: &mut Vec<u8>, color: crate::Hsla) {
              write_f32_vec(bytes, color.h);
              write_f32_vec(bytes, color.s);
              write_f32_vec(bytes, color.l);
              write_f32_vec(bytes, color.a);
          }
          """,
          )

          # Nova shader ABI keeps the same four-float layout but interprets hot colors as RGBA.
          path = "crates/gpui/src/platform/nova/shaders/core.wgsl"
          replace_once(path, "struct LinearColorStop {\n    color: Hsla,", "struct LinearColorStop {\n    color: vec4<f32>,")
          replace_once(path, "    solid: Hsla,", "    solid: vec4<f32>,")

          path = "crates/gpui/src/platform/nova/shaders/quad_common.wgsl"
          replace_once(
              path,
              "    solid: Hsla, colors: array<LinearColorStop, 2>) -> GradientColor {",
              "    solid: vec4<f32>, colors: array<LinearColorStop, 2>) -> GradientColor {",
          )
          replace_once(path, "result.solid = hsla_to_rgba(solid);", "result.solid = solid;")
          replace_once(path, "result.color0 = hsla_to_rgba(colors[0].color);", "result.color0 = colors[0].color;")
          replace_once(path, "result.color1 = hsla_to_rgba(colors[1].color);", "result.color1 = colors[1].color;")
          replace_once(path, "// The hsla_to_rgba is returns a linear sRGB color", "// Scene colors are already linear RGBA")

          for path in [
              "crates/gpui/src/platform/nova/shaders/quad.wgsl",
              "crates/gpui/src/platform/nova/shaders/solid_quad.wgsl",
          ]:
              replace_once(path, "    border_color: Hsla,", "    border_color: vec4<f32>,")
          replace_once(
              "crates/gpui/src/platform/nova/shaders/quad.wgsl",
              "out.border_color = hsla_to_rgba(quad.border_color);",
              "out.border_color = quad.border_color;",
          )
          replace_once(
              "crates/gpui/src/platform/nova/shaders/solid_quad.wgsl",
              "out.color = hsla_to_rgba(quad.background.solid);",
              "out.color = quad.background.solid;",
          )

          for path, struct_name, conversion in [
              ("crates/gpui/src/platform/nova/shaders/shadow.wgsl", "Shadow", "out.color = hsla_to_rgba(shadow.color);"),
              ("crates/gpui/src/platform/nova/shaders/underline.wgsl", "Underline", "out.color = hsla_to_rgba(underline.color);"),
              ("crates/gpui/src/platform/nova/shaders/mono_sprite.wgsl", "MonochromeSprite", "out.color = hsla_to_rgba(sprite.color);"),
          ]:
              replace_once(path, "    color: Hsla,", "    color: vec4<f32>,")
              replace_once(path, conversion, conversion.replace("hsla_to_rgba(", "").replace(");", ";"))

          path = "crates/gpui/src/platform/nova/shaders/path.wgsl"
          replace_once(path, "            Hsla(0.0, 0.0, 0.0, 0.0),", "            vec4<f32>(0.0),")
          replace_count(path, "                    Hsla(0.0, 0.0, 0.0, 0.0),", "                    vec4<f32>(0.0),", 2)

          # Blade backend mirrors Nova's RGBA scene ABI.
          path = "crates/gpui/src/platform/blade/shaders.wgsl"
          replace_once(path, "struct LinearColorStop {\n    color: Hsla,", "struct LinearColorStop {\n    color: vec4<f32>,")
          replace_once(path, "    solid: Hsla,", "    solid: vec4<f32>,")
          replace_once(
              path,
              "    solid: Hsla, colors: array<LinearColorStop, 2>) -> GradientColor {",
              "    solid: vec4<f32>, colors: array<LinearColorStop, 2>) -> GradientColor {",
          )
          replace_once(path, "result.solid = hsla_to_rgba(solid);", "result.solid = solid;")
          replace_once(path, "result.color0 = hsla_to_rgba(colors[0].color);", "result.color0 = colors[0].color;")
          replace_once(path, "result.color1 = hsla_to_rgba(colors[1].color);", "result.color1 = colors[1].color;")
          replace_once(path, "// The hsla_to_rgba is returns a linear sRGB color", "// Scene colors are already linear RGBA")
          replace_once(path, "    border_color: Hsla,", "    border_color: vec4<f32>,")
          replace_once(path, "out.border_color = hsla_to_rgba(quad.border_color);", "out.border_color = quad.border_color;")
          replace_count(path, "    color: Hsla,", "    color: vec4<f32>,", 3)
          replace_once(path, "out.color = hsla_to_rgba(shadow.color);", "out.color = shadow.color;")
          replace_once(path, "out.color = hsla_to_rgba(underline.color);", "out.color = underline.color;")
          replace_once(path, "out.color = hsla_to_rgba(sprite.color);", "out.color = sprite.color;")

          # Metal cbindgen emits Rgba as a four-float struct. Convert it to float4 without
          # performing an HSL color-space conversion in every vertex invocation.
          path = "crates/gpui/build.rs"
          replace_once(path, '            "Hsla".into(),', '            "Hsla".into(),\n            "Rgba".into(),')

          path = "crates/gpui/src/platform/mac/shaders.metal"
          replace_once(path, "float4 hsla_to_rgba(Hsla hsla);", "float4 hsla_to_rgba(Hsla hsla);\nfloat4 rgba_to_float4(Rgba rgba);")
          replace_once(
              path,
              "GradientColor prepare_fill_color(uint tag, uint color_space, Hsla solid, Hsla color0, Hsla color1);",
              "GradientColor prepare_fill_color(uint tag, uint color_space, Rgba solid, Rgba color0, Rgba color1);",
          )
          replace_once(path, "float4 border_color = hsla_to_rgba(quad.border_color);", "float4 border_color = rgba_to_float4(quad.border_color);")
          replace_once(path, "float4 color = hsla_to_rgba(shadow.color);", "float4 color = rgba_to_float4(shadow.color);")
          replace_once(path, "float4 color = hsla_to_rgba(underline.color);", "float4 color = rgba_to_float4(underline.color);")
          replace_once(path, "float4 color = hsla_to_rgba(sprite.color);", "float4 color = rgba_to_float4(sprite.color);")
          replace_once(
              path,
              """GradientColor prepare_fill_color(uint tag, uint color_space, Hsla solid,
                                               Hsla color0, Hsla color1) {
          """,
              """GradientColor prepare_fill_color(uint tag, uint color_space, Rgba solid,
                                               Rgba color0, Rgba color1) {
          """,
          )
          replace_once(path, "out.solid = hsla_to_rgba(solid);", "out.solid = rgba_to_float4(solid);")
          replace_once(path, "out.color0 = hsla_to_rgba(color0);", "out.color0 = rgba_to_float4(color0);")
          replace_once(path, "out.color1 = hsla_to_rgba(color1);", "out.color1 = rgba_to_float4(color1);")
          replace_once(
              path,
              """float4 hsla_to_rgba(Hsla hsla) {
          """,
              """float4 rgba_to_float4(Rgba rgba) {
            return float4(rgba.r, rgba.g, rgba.b, rgba.a);
          }

          float4 hsla_to_rgba(Hsla hsla) {
          """,
          )

          # Keep tests and examples aligned with the retained RGBA representation.
          path = "crates/gpui/src/foundation/color/tests.rs"
          replace_once(
              path,
              """    let color = Hsla::from(rgba(0xff0099ff));
              let mut background = Background::from(color);
              assert_eq!(background.tag, BackgroundTag::Solid);
              assert_eq!(background.solid, color);

              assert_eq!(background.opacity(0.5).solid, color.opacity(0.5));
              assert!(!background.is_transparent());
              background.solid = hsla(0.0, 0.0, 0.0, 0.0);
          """,
              """    let color = rgba(0xff0099ff);
              let mut background = Background::from(Hsla::from(color));
              assert_eq!(background.tag, BackgroundTag::Solid);
              assert_eq!(background.solid, color);

              assert_eq!(background.opacity(0.5).solid, color.opacity(0.5));
              assert!(!background.is_transparent());
              background.solid = rgba(0x00000000);
          """,
          )

          path = "crates/gpui/src/scene/tests.rs"
          replace_once(path, "        color: Hsla::default(),", "        color: Hsla::default().into(),")
          replace_once(path, "        border_color: Hsla::black(),", "        border_color: Hsla::black().into(),")

          # Shader validation should cover both maintained WGSL backends on every host.
          path = "crates/gpui/build.rs"
          replace_once(
              path,
              """    #[cfg(all(
                  feature = "build-shader-validation",
                  target_os = "macos",
                  feature = "macos-blade"
              ))]
              check_blade_wgsl_shaders();
          """,
              """    #[cfg(feature = "build-shader-validation")]
              check_blade_wgsl_shaders();
          """,
          )
          replace_once(
              path,
              """#[cfg(all(
              feature = "build-shader-validation",
              target_os = "macos",
              feature = "macos-blade"
          ))]
          fn check_blade_wgsl_shaders() {
          """,
              """#[cfg(feature = "build-shader-validation")]
          fn check_blade_wgsl_shaders() {
          """,
          )
          PY

      - name: Validate Rust and shader changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          cargo check -p gpui --all-targets --features build-shader-validation

      - name: Commit implementation directly to master
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-native-scene-rgba-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: store scene colors as native RGBA"
          git push origin HEAD:master
