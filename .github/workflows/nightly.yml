name: Nightly

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  prepare:
    name: Detect build-relevant changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      tag: ${{ steps.metadata.outputs.tag }}
      build_version: ${{ steps.metadata.outputs.build_version }}
      head_commit: ${{ steps.metadata.outputs.head_commit }}

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch || 'master' }}

      - name: Detect source, dependency, asset or packaging changes
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual run requested; forcing a nightly build."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="$(git tag --list 'v*-nightly.*' --sort=-creatordate | head -n 1)"
          if [[ -z "$base" ]]; then
            base="$(git tag --list 'v*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          fi
          if [[ -z "$base" ]]; then
            echo "No previous nightly or stable tag exists; building."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t changed_files < <(git diff --name-only "$base..HEAD")
          if ((${#changed_files[@]} == 0)); then
            echo "No commits changed files after $base."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          relevant_pattern='^(src/|crates/|vendor/|assets/|scripts/|packaging/|\.cargo/|Cargo\.toml$|Cargo\.lock$|build\.rs$|rust-toolchain([.]toml)?$|\.github/workflows/(nightly|release|build-release|compile-check)\.yml$)'
          printf 'Files changed after %s:\n' "$base"
          printf '  %s\n' "${changed_files[@]}"

          for path in "${changed_files[@]}"; do
            if [[ "$path" =~ $relevant_pattern ]]; then
              echo "Build-relevant change detected: $path"
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "Only documentation or other non-build files changed after $base; skipping nightly artifacts."
          echo "changed=false" >> "$GITHUB_OUTPUT"

      - name: Prepare nightly metadata
        id: metadata
        if: ${{ steps.detect.outputs.changed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE '/^\[package\]/,/^\[/{s/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p}' Cargo.toml | head -n 1)"
          if [[ -z "$version" ]]; then
            echo "Unable to read [package].version from Cargo.toml" >&2
            exit 1
          fi
          date_utc="$(date -u +%Y%m%d)"
          tag="v${version}-nightly.${date_utc}.${GITHUB_RUN_NUMBER}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build_version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "head_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-and-publish:
    name: Build and publish nightly
    needs: prepare
    if: ${{ needs.prepare.outputs.changed == 'true' }}
    uses: ./.github/workflows/build-release.yml
    with:
      ref: ${{ needs.prepare.outputs.head_commit }}
      tag: ${{ needs.prepare.outputs.tag }}
      build_version: ${{ needs.prepare.outputs.build_version }}
      channel: nightly
      prerelease: true
      release_title: Nightly ${{ needs.prepare.outputs.tag }}
      cleanup_old_nightlies: true
    secrets: inherit
