name: Apply map entity query cache v2

on:
  pull_request:
    branches: [master]
    paths:
      - tools/apply-map-entity-query-cache-v2.py
      - .github/workflows/apply-map-entity-query-cache-v2-once.yml

permissions:
  contents: write

concurrency:
  group: map-entity-query-cache-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: map-entity-query-cache-v2-${{ runner.os }}-rust-1.95-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            map-avatar-input-entity-${{ runner.os }}-rust-1.95-
            player-item-context-v4-${{ runner.os }}-rust-1.95-

      - name: Apply source patch
        shell: pwsh
        run: python tools/apply-map-entity-query-cache-v2.py

      - name: Install Rust 1.95
        shell: pwsh
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup component add rustfmt --toolchain 1.95.0
          rustup default 1.95.0

      - name: Format and diff check
        shell: pwsh
        run: |
          rustfmt --edition 2024 `
            src/core/minecraft/map_info_cache.rs `
            src/ui/window/map_viewer/model.rs `
            src/ui/window/map_viewer/overlays.rs `
            src/ui/window/map_viewer/tests.rs
          git diff --check

      - name: Cargo check
        shell: pwsh
        run: cargo check -p bmcbl --lib --message-format short

      - name: Commit validated implementation
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          Remove-Item -Force tools/apply-map-entity-query-cache-v2.py
          Remove-Item -Force .github/workflows/apply-map-entity-query-cache-v2-once.yml -ErrorAction SilentlyContinue
          git add -A
          git commit -m "fix(map): page and validate entity overlay cache"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
