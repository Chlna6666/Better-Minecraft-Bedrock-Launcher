name: Release

on:
  push:
    tags:
      - "v*"
      - "!v*-nightly.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag, for example v1.2.3
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve stable release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      build_version: ${{ steps.tag.outputs.build_version }}

    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag }}"
          if [[ -z "$tag" && "${{ github.ref_type }}" == "tag" ]]; then
            tag="${{ github.ref_name }}"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Stable release tags must use vX.Y.Z: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build_version=${tag#v}" >> "$GITHUB_OUTPUT"

  build-and-publish:
    name: Build and publish stable release
    needs: resolve
    uses: ./.github/workflows/build-release.yml
    with:
      ref: ${{ needs.resolve.outputs.tag }}
      tag: ${{ needs.resolve.outputs.tag }}
      build_version: ${{ needs.resolve.outputs.build_version }}
      channel: stable
      prerelease: false
      release_title: Release ${{ needs.resolve.outputs.tag }}
      cleanup_old_nightlies: false
    secrets: inherit
