name: Apply player item context v4 once

on:
  push:
    branches: [master]
    paths:
      - tools/.apply-player-item-context-v4-trigger
  pull_request:
    branches: [master]
    paths:
      - tools/.apply-player-item-context-v4-pr-trigger

permissions:
  contents: write

concurrency:
  group: apply-player-item-context-v4-once
  cancel-in-progress: true

jobs:
  integrate-and-validate:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: player-item-context-v4-${{ runner.os }}-rust-1.95-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            player-item-context-v4-${{ runner.os }}-rust-1.95-
            player-workspace-v3-${{ runner.os }}-rust-1.95-

      - name: Apply patch
        shell: pwsh
        run: python tools/run-player-item-context-v4.py

      - name: Install Rust 1.95
        shell: pwsh
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup component add rustfmt --toolchain 1.95.0
          rustup default 1.95.0

      - name: Format
        shell: pwsh
        run: |
          rustfmt --edition 2024 `
            src/ui/window/map_viewer.rs `
            src/ui/window/map_viewer/player_item_menu.rs `
            src/ui/window/map_viewer/player_workspace.rs `
            src/ui/window/map_viewer/panels.rs `
            src/ui/window/map_viewer/interactions.rs
          git diff --check

      - name: Cargo check
        id: check
        continue-on-error: true
        shell: pwsh
        run: |
          $log = "tools/player-item-context-v4-validation.log"
          Remove-Item -Force -ErrorAction SilentlyContinue $log
          cargo check -p bmcbl --lib --message-format short *>&1 | Tee-Object -FilePath $log
          exit $LASTEXITCODE

      - name: Publish failure diagnostics
        if: steps.check.outcome != 'success'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/window/map_viewer.rs src/ui/window/map_viewer tools/player-item-context-v4-validation.log
          git commit -m "ci: apply player item context v4 and record failure"
          git push origin HEAD:master

      - name: Commit success and clean temporary files
        if: steps.check.outcome == 'success'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          Remove-Item -Force tools/.apply-player-item-context-v4-trigger
          Remove-Item -Force tools/apply-player-item-context-v4.py
          Remove-Item -Force tools/run-player-item-context-v4.py
          Remove-Item -Force tools/player-item-context-v4-validation.log -ErrorAction SilentlyContinue
          Remove-Item -Force .github/workflows/apply-player-item-context-v4-once.yml
          git add -A
          git commit -m "feat(map): add player item context operations"
          git push origin HEAD:master

      - name: Fail after diagnostics
        if: steps.check.outcome != 'success'
        shell: pwsh
        run: exit 1
