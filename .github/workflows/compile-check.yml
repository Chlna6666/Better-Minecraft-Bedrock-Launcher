name: Compile Check

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compile-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "8"
  CARGO_TARGET_DIR: target/ci-check
  CARGO_PROFILE_DEV_OPT_LEVEL: "1"
  CARGO_PROFILE_DEV_DEBUG: "1"
  RUST_MIN_STACK: "67108864"

jobs:
  windows-build:
    name: Windows build
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Validate GPUI workspace layout
        shell: pwsh
        run: ./scripts/check_gpui_layout.ps1

      - name: Setup Rust 1.95
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Show Rust versions
        shell: pwsh
        run: |
          rustc -Vv
          cargo -V

      - name: Configure LLVM
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $llvmBin = Join-Path $env:ProgramFiles "LLVM\bin"
          $libclang = @(
            (Join-Path $llvmBin "libclang.dll"),
            (Join-Path $llvmBin "clang.dll")
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $libclang) {
            throw "libclang.dll or clang.dll was not found under $llvmBin"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $llvmBin
          Add-Content -Path $env:GITHUB_ENV -Value "LIBCLANG_PATH=$llvmBin"

      - name: Restore Cargo source cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git
          key: windows-cargo-sources-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-v8
          restore-keys: |
            windows-cargo-sources-${{ runner.arch }}-

      - name: Remove stale compiler outputs
        shell: pwsh
        run: |
          if (Test-Path $env:CARGO_TARGET_DIR) {
            Remove-Item -Recurse -Force $env:CARGO_TARGET_DIR
          }

      - name: Check Bedrock storage crates
        shell: pwsh
        run: cargo check -p bedrock-leveldb -p bedrock-world --all-features

      - name: Build BMCBL library
        shell: pwsh
        run: cargo build --lib

      - name: Build BMCBL executable
        shell: pwsh
        run: cargo build --bin BMCBL

  linux-build:
    name: Linux build
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake libclang-dev llvm-dev ninja-build pkg-config \
            libasound2-dev libdbus-1-dev libegl1-mesa-dev libfontconfig1-dev \
            libfreetype6-dev libgl1-mesa-dev libpipewire-0.3-dev libssl-dev \
            libudev-dev libvulkan-dev libwayland-dev libx11-dev libx11-xcb-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb1-dev \
            libxcursor-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxrandr-dev nasm yasm

      - name: Setup Rust 1.95
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Show Rust versions
        run: |
          rustc -Vv
          cargo -V

      - name: Restore Cargo source cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git
          key: linux-cargo-sources-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-v8
          restore-keys: |
            linux-cargo-sources-${{ runner.arch }}-

      - name: Remove stale compiler outputs
        run: rm -rf "$CARGO_TARGET_DIR"

      - name: Check Bedrock storage crates
        run: cargo check -p bedrock-leveldb -p bedrock-world --all-features

      - name: Build BMCBL library
        run: cargo build --lib

      - name: Build BMCBL executable
        run: cargo build --bin BMCBL

  macos-metal:
    name: macOS Metal checks
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Rust 1.95
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Show toolchain and host
        run: |
          rustc -Vv
          cargo -V
          sw_vers
          uname -m

      - name: Restore Cargo source cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git
          key: macos-metal-cargo-sources-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-v1
          restore-keys: |
            macos-metal-cargo-sources-${{ runner.arch }}-

      - name: Test graphics contracts
        run: cargo test -p gfx-core --all-features --locked

      - name: Test Metal backend
        run: cargo test -p gfx-metal --all-targets --locked

      - name: Run Metal atlas resource smoke
        run: cargo run -p nova-atlas-smoke-metal --locked

      - name: Check GPUI Metal renderer
        run: cargo check -p gpui --no-default-features --features nova-gfx-metal --locked

      - name: Run GPUI Metal window smoke
        run: >-
          cargo run -p nova-gpui-minimal-window-smoke --locked --
          --backend=nova-metal --auto-exit-ms=3000
