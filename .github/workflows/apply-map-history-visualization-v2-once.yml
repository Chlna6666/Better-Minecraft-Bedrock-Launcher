name: Apply map history visualization v2 once

on:
  push:
    branches: [master]
    paths:
      - tools/.apply-map-history-visualization-v2-trigger

permissions:
  contents: write
  issues: write

concurrency:
  group: apply-map-history-visualization-v2-once
  cancel-in-progress: true

jobs:
  apply:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: map-history-v2-${{ runner.os }}-rust-1.95-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            map-history-v2-${{ runner.os }}-rust-1.95-

      - name: Mark validation started
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        shell: pwsh
        run: |
          gh issue comment 16 --repo Chlna6666/Better-Minecraft-Bedrock-Launcher --body "Map history visualization v2 validation started. Run $($env:RUN_ID)."

      - name: Apply and validate history visualization v2
        id: validate
        continue-on-error: true
        shell: pwsh
        run: |
          $log = "history-v2-validation.log"
          Remove-Item -Force -ErrorAction SilentlyContinue $log

          function Invoke-Logged {
            param(
              [string]$Label,
              [scriptblock]$Command
            )
            "`n===== $Label =====" | Tee-Object -FilePath $log -Append
            & $Command *>&1 | Tee-Object -FilePath $log -Append
            if ($LASTEXITCODE -ne 0) {
              throw "$Label failed with exit code $LASTEXITCODE"
            }
          }

          try {
            Invoke-Logged "Install Rust 1.95" {
              rustup toolchain install 1.95.0 --profile minimal
            }
            Invoke-Logged "Install rustfmt" {
              rustup component add rustfmt --toolchain 1.95.0
            }
            Invoke-Logged "Select Rust 1.95" {
              rustup default 1.95.0
            }
            Invoke-Logged "Toolchain versions" {
              rustc --version
              cargo --version
              rustfmt --version
            }
            Invoke-Logged "Apply source patch" {
              python tools/apply_map_history_visualization_v2.py
              python tools/fix_map_history_visualization_v2_compile.py
            }
            Invoke-Logged "Format changed map history files" {
              rustfmt --edition 2024 `
                src/ui/window/map_viewer/map_history.rs `
                src/ui/window/map_viewer/prelude.rs `
                src/ui/window/map_viewer/canvas.rs `
                src/ui/window/map_viewer/lifecycle.rs `
                src/ui/window/map_viewer/history_panel.rs
            }
            Invoke-Logged "Check patch whitespace" {
              git diff --check
            }
            Invoke-Logged "Check BMCBL library" {
              cargo check -p bmcbl --lib --message-format short
            }
          } catch {
            "`nFAILED: $($_.Exception.Message)" | Tee-Object -FilePath $log -Append
            exit 1
          }

      - name: Report validation result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
          RUN_ID: ${{ github.run_id }}
        shell: pwsh
        run: |
          $log = "history-v2-validation.log"
          $tail = if (Test-Path $log) {
            (Get-Content $log -Tail 360 | Out-String)
          } else {
            "Validation log was not created."
          }
          $focused = if (Test-Path $log) {
            (Select-String -Path $log -Pattern 'error\[E[0-9]+\]|error:' -Context 3,6 | Out-String)
          } else {
            ""
          }
          if ($focused.Length -gt 30000) {
            $focused = $focused.Substring($focused.Length - 30000)
          }
          if ($tail.Length -gt 26000) {
            $tail = $tail.Substring($tail.Length - 26000)
          }
          $status = if ($env:VALIDATION_OUTCOME -eq "success") { "succeeded" } else { "failed" }
          $body = @(
            "Map history visualization v2 validation **$status**. Run $($env:RUN_ID)."
            ""
            "Focused compiler errors:"
            '```text'
            $focused
            '```'
            "Validation tail:"
            '```text'
            $tail
            '```'
          ) -join "`n"
          $body | Set-Content -Encoding utf8 history-v2-comment.md
          gh issue comment 16 --repo Chlna6666/Better-Minecraft-Bedrock-Launcher --body-file history-v2-comment.md

      - name: Commit implementation directly to master
        if: steps.validate.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item -Force -ErrorAction SilentlyContinue tools/.apply-map-history-visualization-v2-trigger
          Remove-Item -Force -ErrorAction SilentlyContinue tools/apply_map_history_visualization_v2.py
          Remove-Item -Force -ErrorAction SilentlyContinue tools/fix_map_history_visualization_v2_compile.py
          Remove-Item -Force -ErrorAction SilentlyContinue .github/workflows/apply-map-history-visualization-v2-once.yml
          Remove-Item -Force -ErrorAction SilentlyContinue history-v2-validation.log
          Remove-Item -Force -ErrorAction SilentlyContinue history-v2-comment.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add block-level map history visualization"
          git push origin HEAD:master

      - name: Close diagnostic issue
        if: steps.validate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh issue close 16 --repo Chlna6666/Better-Minecraft-Bedrock-Launcher --comment "Block-level map history visualization committed directly to master."

      - name: Fail after reporting validation error
        if: steps.validate.outcome != 'success'
        shell: pwsh
        run: exit 1
