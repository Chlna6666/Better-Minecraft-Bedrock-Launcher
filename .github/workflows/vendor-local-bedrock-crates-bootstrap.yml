name: Validate local Bedrock integration

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize
      - edited

permissions:
  contents: write

concurrency:
  group: local-bedrock-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.head_ref == 'work/local-bedrock-crates'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/local-bedrock-crates

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev \
            libdbus-1-dev \
            libegl1-mesa-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Remove final migration artifacts and validate
        shell: bash
        run: |
          set +e
          validation=/tmp/local-bedrock-final-validation.txt
          : > "$validation"
          status=0

          echo '=== remove final dead compatibility files ===' >> "$validation"
          rm -f \
            src/ui/window/map_viewer/preview_3d_stable.rs \
            .github/workflows/local-bedrock-second-phase.yml \
            scripts/bedrock_compatibility_cleanup.txt \
            scripts/map_compatibility_cleanup.txt \
            scripts/trigger_map_canvas_fix.txt \
            scripts/trigger_map_render_preview_cleanup.txt \
            scripts/trigger_map_compatibility_cleanup.txt \
            scripts/trigger_map_view_canvas_cleanup.txt

          echo '=== zero-tolerance legacy API and file guard ===' >> "$validation"
          if grep -RIn -E \
            'for_each_(key|entry)_partitioned|PendingManifest|pending_manifest|manifest_probe|manifest_scanned|tile_manifest|TileManifest|PROBE_GROUP|fn world_pool|open_with_cache_options|cache_size|occupancy_scanned_tiles|mark_occupancy_tile_empty|tile_plan_(stable|legacy)|lifecycle_stable|canvas_(frontend_)?stable|canvas_legacy|helpers_(stable|legacy)|viewport_(stable|base)|view_(stable|legacy)|tile_render_(current|stable|legacy)|preview_3d_(region|stable|legacy)|LegacyMeshSignature|legacy_mesh_signature|convert_legacy_mesh' \
            crates/bedrock-leveldb/src crates/bedrock-world/src crates/bedrock-render/src \
            src/ui/window/map_viewer src/ui/window/map_viewer.rs \
            >> "$validation" 2>&1; then
            echo 'legacy API or compatibility symbol remains' >> "$validation"
            status=1
          fi
          if find src/ui/window/map_viewer -maxdepth 1 -type f \
            \( -name '*_legacy.rs' -o -name '*_stable.rs' -o -name '*_current.rs' \) \
            -print -quit | grep -q .; then
            echo 'versioned compatibility file remains:' >> "$validation"
            find src/ui/window/map_viewer -maxdepth 1 -type f \
              \( -name '*_legacy.rs' -o -name '*_stable.rs' -o -name '*_current.rs' \) \
              -print >> "$validation"
            status=1
          fi

          if [[ "$status" -eq 0 ]]; then
            echo '=== format local Bedrock crates and BMCBL ===' >> "$validation"
            cargo fmt \
              -p bedrock-leveldb \
              -p bedrock-world \
              -p bedrock-render \
              -p bmcbl \
              >> "$validation" 2>&1
            status=$?
          fi

          if [[ "$status" -eq 0 ]]; then
            echo '=== check bedrock-leveldb ===' >> "$validation"
            cargo check --manifest-path crates/bedrock-leveldb/Cargo.toml --all-features >> "$validation" 2>&1
            status=$?
          fi
          if [[ "$status" -eq 0 ]]; then
            echo '=== test bedrock-leveldb ===' >> "$validation"
            cargo test --manifest-path crates/bedrock-leveldb/Cargo.toml --all-features --lib >> "$validation" 2>&1
            status=$?
          fi

          if [[ "$status" -eq 0 ]]; then
            echo '=== check bedrock-world ===' >> "$validation"
            cargo check --manifest-path crates/bedrock-world/Cargo.toml --all-features >> "$validation" 2>&1
            status=$?
          fi
          if [[ "$status" -eq 0 ]]; then
            echo '=== test bedrock-world partitioned executor ===' >> "$validation"
            cargo test --manifest-path crates/bedrock-world/Cargo.toml --all-features --test partitioned_executor >> "$validation" 2>&1
            status=$?
          fi

          if [[ "$status" -eq 0 ]]; then
            echo '=== check bedrock-render map features ===' >> "$validation"
            cargo check --manifest-path crates/bedrock-render/Cargo.toml --no-default-features --features 'async,webp,png' >> "$validation" 2>&1
            status=$?
          fi
          if [[ "$status" -eq 0 ]]; then
            echo '=== test bedrock-render occupancy ===' >> "$validation"
            cargo test --manifest-path crates/bedrock-render/Cargo.toml --no-default-features --features 'async,webp,png' --lib occupancy >> "$validation" 2>&1
            status=$?
          fi

          if [[ "$status" -eq 0 ]]; then
            echo '=== compile BMCBL library ===' >> "$validation"
            cargo check -p bmcbl --lib >> "$validation" 2>&1
            status=$?
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          if [[ "$status" -eq 0 ]]; then
            git add -A .github/workflows/local-bedrock-second-phase.yml src scripts Cargo.lock \
              crates/bedrock-leveldb crates/bedrock-world crates/bedrock-render
            if ! git diff --cached --quiet; then
              git commit -m 'refactor(bedrock): 删除剩余兼容层并完成集成验证'
              git push origin HEAD:work/local-bedrock-crates
            fi
          else
            cp "$validation" scripts/local_bedrock_final_validation.txt
            git add -A .github/workflows/local-bedrock-second-phase.yml src scripts Cargo.lock \
              crates/bedrock-leveldb crates/bedrock-world crates/bedrock-render
            if ! git diff --cached --quiet; then
              git commit -m 'wip(bedrock): 保留最终兼容层清理后的验证错误'
              git push origin HEAD:work/local-bedrock-crates
            fi
          fi

          cat "$validation"
          exit "$status"
