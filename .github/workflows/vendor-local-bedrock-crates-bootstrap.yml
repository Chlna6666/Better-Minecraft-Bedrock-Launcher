name: Apply local map compatibility cleanup

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize
      - edited

permissions:
  contents: write

concurrency:
  group: local-map-compatibility-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'work/local-bedrock-crates'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/local-bedrock-crates

      - name: Detect staged cleanup
        id: cleanup
        shell: bash
        run: |
          if [[ -f scripts/remove_map_render_preview_version_layers.py ]]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Linux build dependencies
        if: steps.cleanup.outputs.needed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev \
            libdbus-1-dev \
            libegl1-mesa-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Rename render and preview modules and compile BMCBL
        if: steps.cleanup.outputs.needed == 'true'
        shell: bash
        run: |
          set +e
          validation=/tmp/map-compatibility-cleanup.txt
          : > "$validation"

          echo '=== replace versioned render and preview modules ===' >> "$validation"
          python3 scripts/remove_map_render_preview_version_layers.py >> "$validation" 2>&1
          status=$?

          if [[ "$status" -eq 0 ]]; then
            echo '=== compatibility symbol guard ===' >> "$validation"
            if grep -RIn -E \
              'tile_render_(current|stable|legacy)|preview_3d_(region|legacy)|LegacyMeshSignature|legacy_mesh_signature|convert_legacy_mesh' \
              src/ui/window/map_viewer src/ui/window/map_viewer.rs \
              >> "$validation" 2>&1; then
              echo 'render/preview version compatibility layer remains' >> "$validation"
              status=1
            fi
          fi

          if [[ "$status" -eq 0 ]]; then
            echo '=== format BMCBL ===' >> "$validation"
            cargo fmt -p bmcbl >> "$validation" 2>&1
            status=$?
          fi

          if [[ "$status" -eq 0 ]]; then
            echo '=== compile BMCBL library ===' >> "$validation"
            cargo check -p bmcbl --lib >> "$validation" 2>&1
            status=$?
          fi

          cp "$validation" scripts/map_compatibility_cleanup.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          if [[ "$status" -eq 0 ]]; then
            rm -f scripts/remove_map_render_preview_version_layers.py
            git add -A src scripts Cargo.lock
            if ! git diff --cached --quiet; then
              git commit -m 'refactor(map): 删除渲染与预览版本兼容层'
              git push origin HEAD:work/local-bedrock-crates
            fi
          else
            git add -A src scripts Cargo.lock
            if ! git diff --cached --quiet; then
              git commit -m 'wip(map): 保留渲染与预览清理后的编译错误'
              git push origin HEAD:work/local-bedrock-crates
            fi
          fi

          cat "$validation"
          exit "$status"
