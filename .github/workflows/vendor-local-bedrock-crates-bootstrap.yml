name: Apply local Bedrock occupancy refactor

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'work/local-bedrock-crates'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/local-bedrock-crates

      - name: Decode and inspect patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode scripts/apply_local_bedrock_occupancy.py.gz.b64 | gzip --decompress > scripts/apply_local_bedrock_occupancy.py
          echo '--- patch lines 440-510 ---'
          nl -ba scripts/apply_local_bedrock_occupancy.py | sed -n '440,510p'
          echo '--- lifecycle candidate methods ---'
          grep -n "fn schedule_\|fn refresh_render_session\|fn retire_render_session" src/ui/window/map_viewer/lifecycle.rs | tail -n 40
          exit 1
