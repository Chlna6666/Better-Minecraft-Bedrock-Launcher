name: Apply Model Plane Sidedness

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/apply-model-plane-sidedness.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch sidedness integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def one(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # JE packed solid/rotated element faces are physical front faces, not decals.
          one(
              'crates/bedrock-block-model/src/java_runtime.rs',
              '            ModelPlane::new(corners, nearest_axis_normal(normal))\n                .with_material_slot(face.material_slot)',
              '            ModelPlane::new(corners, nearest_axis_normal(normal))\n                .front_only()\n                .with_material_slot(face.material_slot)',
              'Java runtime front-only plane',
          )

          one(
              'crates/bedrock-block-model/src/model_family.rs',
              'pub use shape::{ModelCuboid, ModelPlane, ModelShape};',
              'pub use shape::{ModelCuboid, ModelPlane, ModelPlaneSidedness, ModelShape};',
              'model family sidedness export',
          )
          one(
              'crates/bedrock-block-model/src/bedrock_block_model.rs',
              '    ModelCuboid, ModelFamily, ModelPlane, ModelShape, canonical_block_name_for_state,',
              '    ModelCuboid, ModelFamily, ModelPlane, ModelPlaneSidedness, ModelShape,\n    canonical_block_name_for_state,',
              'crate sidedness export',
          )

          preview = Path('src/ui/window/map_viewer/preview_3d_source.rs')
          text = preview.read_text(encoding='utf-8')

          replacements = [
              (
                  '    ModelCuboid, ModelPlane, ModelShape, ModelWarning, block_export_material_name_for_block,',
                  '    ModelCuboid, ModelPlane, ModelPlaneSidedness, ModelShape, ModelWarning,\n    block_export_material_name_for_block,',
                  'preview sidedness import',
              ),
              (
                  'struct Preview3dDetailShape {\n    cuboids: Vec<Preview3dCuboid>,\n    planes: Vec<Preview3dPlane>,\n}',
                  'struct Preview3dDetailShape {\n    cuboids: Vec<Preview3dCuboid>,\n    planes: Vec<Preview3dPlane>,\n    one_sided_planes: Vec<Preview3dPlane>,\n}',
                  'preview detail shape field',
              ),
              (
                  '        Self {\n            cuboids: cuboids.into(),\n            planes: Vec::new(),\n        }',
                  '        Self {\n            cuboids: cuboids.into(),\n            planes: Vec::new(),\n            one_sided_planes: Vec::new(),\n        }',
                  'preview detail constructor',
              ),
              (
                  '        self.cuboids.is_empty() && self.planes.is_empty()',
                  '        self.cuboids.is_empty()\n            && self.planes.is_empty()\n            && self.one_sided_planes.is_empty()',
                  'preview detail empty check',
              ),
              (
                  '    for plane in &mut shape.planes {\n        plane.uv = Some(uv);\n    }',
                  '    for plane in shape\n        .planes\n        .iter_mut()\n        .chain(shape.one_sided_planes.iter_mut())\n    {\n        plane.uv = Some(uv);\n    }',
                  'preview full texture UV planes',
              ),
              (
                  '    shape.planes.clear();\n}',
                  '    shape.planes.clear();\n    shape.one_sided_planes.clear();\n}',
                  'preview shulker clear planes',
              ),
              (
                  '    shape.planes.extend(preview_3d_rotated_cuboid_planes(',
                  '    shape\n        .one_sided_planes\n        .extend(preview_3d_rotated_cuboid_planes(',
                  'Bedrock rotated cube front-only planes',
              ),
              (
                  '    shape.planes.is_empty()\n        && shape.cuboids.len() == 1',
                  '    shape.planes.is_empty()\n        && shape.one_sided_planes.is_empty()\n        && shape.cuboids.len() == 1',
                  'preview full cube sidedness check',
              ),
          ]
          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          old_convert = '''fn preview_3d_detail_shape_from_model_shape(shape: ModelShape) -> Preview3dDetailShape {
              Preview3dDetailShape {
                  cuboids: shape
                      .cuboids
                      .into_iter()
                      .map(preview_3d_cuboid_from_model_cuboid)
                      .collect(),
                  planes: shape
                      .planes
                      .into_iter()
                      .map(preview_3d_plane_from_model_plane)
                      .collect(),
              }
          }'''.replace('          ', '')
          new_convert = '''fn preview_3d_detail_shape_from_model_shape(shape: ModelShape) -> Preview3dDetailShape {
              let mut result = Preview3dDetailShape {
                  cuboids: shape
                      .cuboids
                      .into_iter()
                      .map(preview_3d_cuboid_from_model_cuboid)
                      .collect(),
                  planes: Vec::new(),
                  one_sided_planes: Vec::new(),
              };
              for plane in shape.planes {
                  let sidedness = plane.sidedness;
                  let plane = preview_3d_plane_from_model_plane(plane);
                  match sidedness {
                      ModelPlaneSidedness::DoubleSided => result.planes.push(plane),
                      ModelPlaneSidedness::FrontOnly => result.one_sided_planes.push(plane),
                  }
              }
              result
          }'''.replace('          ', '')
          if text.count(old_convert) != 1:
              raise SystemExit(f'preview model shape conversion: expected 1 match, found {text.count(old_convert)}')
          text = text.replace(old_convert, new_convert, 1)

          old_push = '''fn preview_3d_push_detail_block_faces(
              block: &Preview3dDetailBlock,
              shape: &Preview3dDetailShape,
              faces: &mut Vec<Preview3dFace>,
          ) {
              for cuboid in &shape.cuboids {
                  preview_3d_push_cuboid_faces(
                      block.key,
                      cuboid.clone(),
                      block.color,
                      block.material.clone(),
                      faces,
                  );
              }
              for plane in &shape.planes {
                  preview_3d_push_plane_face(
                      block.key,
                      plane.clone(),
                      block.color,
                      block.material.clone(),
                      faces,
                  );
                  preview_3d_push_plane_face(
                      block.key,
                      Preview3dPlane {
                          corners: [
                              plane.corners[3],
                              plane.corners[2],
                              plane.corners[1],
                              plane.corners[0],
                          ],
                          normal: [-plane.normal[0], -plane.normal[1], -plane.normal[2]],
                          material_slot: plane.material_slot.clone(),
                          uv: plane.uv.map(|[a, b, c, d]| [d, c, b, a]),
                      },
                      block.color,
                      block.material.clone(),
                      faces,
                  );
              }
          }'''.replace('          ', '')
          new_push = '''fn preview_3d_push_detail_block_faces(
              block: &Preview3dDetailBlock,
              shape: &Preview3dDetailShape,
              faces: &mut Vec<Preview3dFace>,
          ) {
              for cuboid in &shape.cuboids {
                  preview_3d_push_cuboid_faces(
                      block.key,
                      cuboid.clone(),
                      block.color,
                      block.material.clone(),
                      faces,
                  );
              }
              for plane in &shape.planes {
                  preview_3d_push_plane_face(
                      block.key,
                      plane.clone(),
                      block.color,
                      block.material.clone(),
                      faces,
                  );
                  preview_3d_push_plane_face(
                      block.key,
                      Preview3dPlane {
                          corners: [
                              plane.corners[3],
                              plane.corners[2],
                              plane.corners[1],
                              plane.corners[0],
                          ],
                          normal: [-plane.normal[0], -plane.normal[1], -plane.normal[2]],
                          material_slot: plane.material_slot.clone(),
                          uv: plane.uv.map(|[a, b, c, d]| [d, c, b, a]),
                      },
                      block.color,
                      block.material.clone(),
                      faces,
                  );
              }
              for plane in &shape.one_sided_planes {
                  preview_3d_push_plane_face(
                      block.key,
                      plane.clone(),
                      block.color,
                      block.material.clone(),
                      faces,
                  );
              }
          }'''.replace('          ', '')
          if text.count(old_push) != 1:
              raise SystemExit(f'preview detail face push: expected 1 match, found {text.count(old_push)}')
          text = text.replace(old_push, new_push, 1)
          preview.write_text(text, encoding='utf-8')
          PY

      - name: Set up Rust 1.95
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Format changed Rust
        shell: bash
        run: |
          rustfmt --edition 2024 \
            crates/bedrock-block-model/src/model_family/shape.rs \
            crates/bedrock-block-model/src/model_family.rs \
            crates/bedrock-block-model/src/bedrock_block_model.rs \
            crates/bedrock-block-model/src/java_runtime.rs \
            src/ui/window/map_viewer/preview_3d_source.rs

      - name: Test block model runtime
        shell: bash
        run: cargo test -p bedrock-block-model --lib java_runtime

      - name: Check BMCBL library
        shell: bash
        run: cargo check --lib

      - name: Validate diff
        shell: bash
        run: git diff --check

      - name: Commit sidedness integration
        shell: bash
        run: |
          git rm .github/workflows/apply-model-plane-sidedness.yml
          git add \
            crates/bedrock-block-model/src/model_family/shape.rs \
            crates/bedrock-block-model/src/model_family.rs \
            crates/bedrock-block-model/src/bedrock_block_model.rs \
            crates/bedrock-block-model/src/java_runtime.rs \
            src/ui/window/map_viewer/preview_3d_source.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(方块模型): 区分实体面与双面薄片"
          git push origin HEAD:master
