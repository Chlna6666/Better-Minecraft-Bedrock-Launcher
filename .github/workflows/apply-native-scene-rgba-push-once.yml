name: Apply native scene RGBA refactor from push

on:
  push:
    branches: [master]
    paths:
      - tools/.native-scene-rgba-trigger

permissions:
  contents: write
  issues: write

concurrency:
  group: apply-native-scene-rgba-push-once
  cancel-in-progress: true

jobs:
  apply:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Mark task started
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh issue comment 15 --repo Chlna6666/Better-Minecraft-Bedrock-Launcher --body "Native Scene RGBA push task started. Run ${{ github.run_id }}."

      - name: Apply and validate native RGBA refactor
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-native-scene-rgba-once.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Validate Rust and shader changes"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])

          nova_old = '''path = "crates/gpui/src/platform/nova/shaders/path.wgsl"
          replace_once(path, "            Hsla(0.0, 0.0, 0.0, 0.0),", "            vec4<f32>(0.0),")
          replace_count(path, "                    Hsla(0.0, 0.0, 0.0, 0.0),", "                    vec4<f32>(0.0),", 2)
          '''
          nova_new = '''path = "crates/gpui/src/platform/nova/shaders/path.wgsl"
          replace_count(path, "            Hsla(0.0, 0.0, 0.0, 0.0),", "            vec4<f32>(0.0),", 3)
          '''
          if script.count(nova_old) != 1:
              raise SystemExit(
                  f"expected one Nova path replacement block, found {script.count(nova_old)}"
              )
          script = script.replace(nova_old, nova_new, 1)

          blade_start = script.index(
              'path = "crates/gpui/src/platform/blade/shaders.wgsl"'
          )
          blade_broad = 'replace_once(path, "    solid: Hsla,", "    solid: vec4<f32>,")'
          blade_match = script.index(blade_broad, blade_start)
          blade_scoped = r'''replace_once(
              path,
              "    color_space: u32,\n    solid: Hsla,\n    gradient_angle_or_pattern_height: f32,",
              "    color_space: u32,\n    solid: vec4<f32>,\n    gradient_angle_or_pattern_height: f32,",
          )'''
          script = (
              script[:blade_match]
              + blade_scoped
              + script[blade_match + len(blade_broad):]
          )

          Path('/tmp/apply_native_scene_rgba.py').write_text(script, encoding='utf-8')
          PY
            python3 /tmp/apply_native_scene_rgba.py
            git diff --check
            cargo check -p gpui --lib --features build-shader-validation,x11
          ) > >(tee /tmp/native-rgba-validation.log) 2>&1
          status=$?
          {
            if [ "$status" -eq 0 ]; then
              echo 'Native Scene RGBA patch and focused validation succeeded.'
            else
              echo "Native Scene RGBA patch or focused validation failed with status $status."
            fi
            echo
            echo '```text'
            tail -c 60000 /tmp/native-rgba-validation.log
            echo '```'
          } > /tmp/native-rgba-comment.md
          gh issue comment 15 --repo Chlna6666/Better-Minecraft-Bedrock-Launcher --body-file /tmp/native-rgba-comment.md
          exit "$status"

      - name: Commit implementation directly to master
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/.native-scene-rgba-trigger
          rm -f tools/.native-scene-rgba-diagnostic-trigger
          rm -f .github/workflows/apply-native-scene-rgba-once.yml
          rm -f .github/workflows/apply-native-scene-rgba-issue-once.yml
          rm -f .github/workflows/diagnose-native-scene-rgba-once.yml
          rm -f .github/workflows/diagnose-native-scene-rgba-workflow-run-once.yml
          rm -f .github/workflows/diagnose-native-scene-rgba-patch-push-once.yml
          rm -f .github/workflows/apply-native-scene-rgba-push-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: store scene colors as native RGBA"
          git push origin HEAD:master

      - name: Close diagnostic issues
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue close 13 --repo Chlna6666/Better-Minecraft-Bedrock-Launcher --comment "Native Scene RGBA refactor committed to master." || true
          gh issue close 14 --repo Chlna6666/Better-Minecraft-Bedrock-Launcher --comment "Native Scene RGBA refactor committed to master." || true
          gh issue close 15 --repo Chlna6666/Better-Minecraft-Bedrock-Launcher --comment "Native Scene RGBA refactor committed to master." || true
