name: Apply native scene RGBA refactor from issue

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: apply-native-scene-rgba-once
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.issue.title == '[internal] apply native scene RGBA refactor once'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Apply and validate native RGBA refactor
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        shell: bash
        run: |
          set +e
          {
            set -euo pipefail
            python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-native-scene-rgba-once.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Validate Rust and shader changes"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          Path('/tmp/apply_native_scene_rgba.py').write_text(
              textwrap.dedent(workflow[start:end]), encoding='utf-8'
          )
          PY
            python3 /tmp/apply_native_scene_rgba.py
            git diff --check
            cargo check -p gpui --all-targets --features build-shader-validation
          } > >(tee /tmp/native-rgba-validation.log) 2>&1
          status=$?
          {
            if [ "$status" -eq 0 ]; then
              echo 'Native Scene RGBA patch and validation succeeded.'
            else
              echo "Native Scene RGBA patch or validation failed with status $status."
            fi
            echo
            echo '```text'
            tail -c 50000 /tmp/native-rgba-validation.log
            echo '```'
          } > /tmp/native-rgba-comment.md
          gh issue comment "$ISSUE_URL" --body-file /tmp/native-rgba-comment.md
          exit "$status"

      - name: Commit implementation directly to master
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-native-scene-rgba-once.yml
          rm -f .github/workflows/apply-native-scene-rgba-issue-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: store scene colors as native RGBA"
          git push origin HEAD:master

      - name: Close trigger issue after successful commit
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        shell: bash
        run: gh issue close "$ISSUE_URL" --comment "Native scene RGBA refactor committed to master."
