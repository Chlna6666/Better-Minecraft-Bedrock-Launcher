name: Temporary GPUI window-clock source validation
on:
  push:
    paths:
      - .github/workflows/temporary-gpui-framecheck.yml
permissions:
  contents: read
jobs:
  gpui-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --package gpui -- --check
