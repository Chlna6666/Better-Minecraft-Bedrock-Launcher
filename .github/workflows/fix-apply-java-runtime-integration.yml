name: Fix Java Runtime Integration Bootstrap

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/fix-apply-java-runtime-integration.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch bootstrap workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/apply-java-runtime-integration.yml')
          source = path.read_text(encoding='utf-8')
          old_setup = "          toolchain: 1.95.0\n\n      - name: Check formatting\n"
          new_setup = "          toolchain: 1.95.0\n          components: rustfmt\n\n      - name: Format integration\n"
          if source.count(old_setup) != 1:
              raise SystemExit('Rust setup block did not match exactly once')
          source = source.replace(old_setup, new_setup, 1)
          old_command = "run: rustfmt --edition 2024 --check crates/bedrock-block-model/src/java_runtime.rs"
          new_command = "run: rustfmt --edition 2024 crates/bedrock-block-model/src/java_runtime.rs"
          if source.count(old_command) != 1:
              raise SystemExit('rustfmt command did not match exactly once')
          path.write_text(source.replace(old_command, new_command, 1), encoding='utf-8')
          PY

      - name: Commit bootstrap fix
        shell: bash
        run: |
          git rm .github/workflows/fix-apply-java-runtime-integration.yml
          git add .github/workflows/apply-java-runtime-integration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci(方块模型): 修复 Java 运行时接入自举"
          git push origin HEAD:master
