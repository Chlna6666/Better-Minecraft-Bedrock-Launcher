name: Apply map spawn center fix

on:
  push:
    branches:
      - work/local-bedrock-crates
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-map-spawn-center-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/local-bedrock-crates
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Apply source fix
        run: python3 scripts/apply_map_spawn_center_fix.py

      - name: Format changed Rust files
        run: rustfmt --edition 2024 src/ui/window/map_viewer/helpers.rs src/ui/window/map_viewer/lifecycle.rs

      - name: Verify normal targets
        env:
          CARGO_INCREMENTAL: "0"
          RUST_MIN_STACK: "67108864"
        run: |
          cargo check --lib
          cargo check --bin BMCBL

      - name: Commit source fix and remove temporary automation
        shell: bash
        run: |
          rm -f scripts/apply_map_spawn_center_fix.py
          rm -f .github/workflows/apply-map-spawn-center-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(map): 以 level.dat 出生点初始化视口"
          git push origin HEAD:work/local-bedrock-crates
