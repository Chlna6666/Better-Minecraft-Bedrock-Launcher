name: Apply RGBA first-class color fix from workflow completion

on:
  workflow_run:
    workflows:
      - "Apply Linux raw-window-handle fix"
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: apply-rgba-first-class-color-fix-once
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.workflow_run.id == 29842972851
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Extract and apply RGBA source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-rgba-first-class-once.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Validate patch shape"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          Path('/tmp/apply_rgba_fix.py').write_text(script, encoding='utf-8')
          PY
          python3 /tmp/apply_rgba_fix.py

      - name: Validate implementation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F "pub const fn rgb" crates/gpui/src/foundation/color/rgba.rs
          grep -F "color: Rgba" src/ui/window/map_viewer/canvas.rs
          grep -F -- "-> Rgba" src/ui/window/map_viewer/history_panel.rs

      - name: Commit implementation directly to master
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-rgba-first-class-once.yml
          rm -f .github/workflows/apply-rgba-first-class-workflow-run-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make RGBA a first-class paint color"
          git push origin HEAD:master
