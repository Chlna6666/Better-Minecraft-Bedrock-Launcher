name: Cleanup branches once

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "agent/linux-release-nightly"
            "ci/compile-check-cache-test"
            "delete-me-2"
            "local-bedrock-crates-trigger"
            "noop"
            "temp-map-render-revert"
            "temp-map-render-revert-2"
            "temporary-ignore"
            "work/local-bedrock-crates"
            "work/local-bedrock-crates-pr-sync"
            "work/local-bedrock-crates-test"
            "work/local-bedrock-crates-test2"
            "cleanup/branches-once"
          )

          for branch in "${branches[@]}"; do
            echo "Deleting branch: $branch"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" || true
          done
