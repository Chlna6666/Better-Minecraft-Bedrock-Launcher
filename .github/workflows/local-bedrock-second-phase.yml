name: Local Bedrock compatibility cleanup

on:
  push:
    branches:
      - work/local-bedrock-crates
    paths:
      - '.github/workflows/local-bedrock-second-phase.yml'
      - 'scripts/remove_bedrock_compatibility_api.py'
  workflow_dispatch:

concurrency:
  group: local-bedrock-compatibility-cleanup-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  remove-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/local-bedrock-crates
          fetch-depth: 2

      - name: Install desktop build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            libasound2-dev \
            libudev-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libgl1-mesa-dev

      - name: Remove old APIs and compile
        shell: bash
        run: |
          set +e
          validation=/tmp/bedrock_compatibility_cleanup.txt
          : > "$validation"

          echo '=== remove old APIs and transition modules ===' >> "$validation"
          if [ -f src/ui/window/map_viewer/tile_plan_stable.rs ] \
            || [ -f src/ui/window/map_viewer/lifecycle_stable.rs ] \
            || grep -Rqs -E 'for_each_(key|entry)_partitioned' \
              crates/bedrock-leveldb/src crates/bedrock-world/src crates/bedrock-render/src; then
            python scripts/remove_bedrock_compatibility_api.py >> "$validation" 2>&1
            status=$?
          else
            echo 'cleanup already applied; validating current source tree' >> "$validation"
            status=0
          fi

          if [ "$status" -eq 0 ]; then
            echo '=== zero-tolerance legacy symbol guard ===' >> "$validation"
            if grep -RIn -E \
              'for_each_(key|entry)_partitioned|PendingManifest|pending_manifest|manifest_probe|manifest_scanned|tile_manifest|TileManifest|PROBE_GROUP|fn world_pool|open_with_cache_options|cache_size|occupancy_scanned_tiles|mark_occupancy_tile_empty|tile_plan_legacy|tile_plan_stable|lifecycle_stable|canvas_frontend_stable' \
              crates/bedrock-leveldb/src crates/bedrock-world/src crates/bedrock-render/src \
              src/ui/window/map_viewer src/ui/window/map_viewer.rs \
              >> "$validation" 2>&1; then
              echo 'legacy Bedrock or map API remains' >> "$validation"
              status=1
            fi
          fi

          if [ "$status" -eq 0 ]; then
            echo '=== format local Bedrock crates and BMCBL ===' >> "$validation"
            cargo fmt \
              -p bedrock-leveldb \
              -p bedrock-world \
              -p bedrock-render \
              -p bmcbl \
              >> "$validation" 2>&1
            status=$?
          fi

          if [ "$status" -eq 0 ]; then
            echo '=== check bedrock-leveldb ===' >> "$validation"
            cargo check --manifest-path crates/bedrock-leveldb/Cargo.toml --all-features >> "$validation" 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            echo '=== test bedrock-leveldb ===' >> "$validation"
            cargo test --manifest-path crates/bedrock-leveldb/Cargo.toml --all-features --lib >> "$validation" 2>&1
            status=$?
          fi

          if [ "$status" -eq 0 ]; then
            echo '=== check bedrock-world ===' >> "$validation"
            cargo check --manifest-path crates/bedrock-world/Cargo.toml --all-features >> "$validation" 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            echo '=== test bedrock-world partitioned/executor ===' >> "$validation"
            cargo test --manifest-path crates/bedrock-world/Cargo.toml --all-features --test partitioned_executor >> "$validation" 2>&1
            status=$?
          fi

          if [ "$status" -eq 0 ]; then
            echo '=== check bedrock-render map features ===' >> "$validation"
            cargo check --manifest-path crates/bedrock-render/Cargo.toml --no-default-features --features 'async,webp,png' >> "$validation" 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            echo '=== test bedrock-render occupancy ===' >> "$validation"
            cargo test --manifest-path crates/bedrock-render/Cargo.toml --no-default-features --features 'async,webp,png' --lib occupancy >> "$validation" 2>&1
            status=$?
          fi

          if [ "$status" -eq 0 ]; then
            echo '=== compile BMCBL library ===' >> "$validation"
            cargo check -p bmcbl --lib >> "$validation" 2>&1
            status=$?
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          cp "$validation" scripts/bedrock_compatibility_cleanup.txt
          git add -A \
            crates/bedrock-leveldb \
            crates/bedrock-world \
            crates/bedrock-render \
            src \
            scripts \
            Cargo.lock

          if ! git diff --cached --quiet; then
            if [ "$status" -eq 0 ]; then
              git commit -m 'refactor(bedrock): 删除旧接口并更新 BMCBL 调用'
            else
              git commit -m 'wip(bedrock): 保留旧接口清理后的编译错误'
            fi
            git push origin HEAD:work/local-bedrock-crates
          fi

          cat "$validation"
          exit "$status"
