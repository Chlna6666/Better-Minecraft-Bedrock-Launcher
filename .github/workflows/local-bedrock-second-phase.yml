name: Local Bedrock second phase

on:
  push:
    branches:
      - work/local-bedrock-crates
    paths:
      - '.github/workflows/local-bedrock-second-phase.yml'
      - 'scripts/apply_bmcbl_occupancy_state.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/local-bedrock-crates
          fetch-depth: 1
      - name: Remove viewport manifest probes and integrate occupancy index
        shell: bash
        run: |
          set +e
          validation=/tmp/second_phase_validation.txt
          : > "$validation"
          echo '=== apply BMCBL occupancy state ===' >> "$validation"
          python scripts/apply_bmcbl_occupancy_state.py >> "$validation" 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            echo '=== legacy API guard ===' >> "$validation"
            if grep -RIn -E 'PendingManifest|pending_manifest|manifest_probe|manifest_scanned|tile_manifest|TileManifest|PROBE_GROUP' src/ui/window/map_viewer src/ui/window/map_viewer.rs crates/bedrock-render/src >> "$validation" 2>&1; then
              echo 'legacy manifest/probe implementation remains' >> "$validation"
              status=1
            fi
          fi
          if [ "$status" -eq 0 ]; then
            echo '=== fmt ===' >> "$validation"
            cargo fmt --all >> "$validation" 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            echo '=== check bedrock-render map features ===' >> "$validation"
            cargo check --manifest-path crates/bedrock-render/Cargo.toml --no-default-features --features 'async,webp,png' >> "$validation" 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            echo '=== test occupancy index ===' >> "$validation"
            cargo test --manifest-path crates/bedrock-render/Cargo.toml --no-default-features --features 'async,webp,png' --lib occupancy >> "$validation" 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            echo '=== check BMCBL library ===' >> "$validation"
            cargo check -p bmcbl --lib >> "$validation" 2>&1
            status=$?
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            cp "$validation" scripts/second_phase_validation.txt
            git add scripts/second_phase_validation.txt
            if ! git diff --cached --quiet; then
              git commit -m 'chore: 记录 BMCBL occupancy 迁移验证失败'
              git push origin HEAD:work/local-bedrock-crates
            fi
            cat "$validation"
            exit "$status"
          fi

          cp "$validation" scripts/second_phase_validation.txt
          git add src/ui/window/map_viewer src/ui/window/map_viewer.rs crates/bedrock-leveldb crates/bedrock-render scripts/second_phase_validation.txt Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m 'refactor(map): 删除视口 manifest 探测并接入 occupancy 索引'
            git push origin HEAD:work/local-bedrock-crates
          fi
          cat "$validation"
