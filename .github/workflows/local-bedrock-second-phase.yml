name: Local Bedrock second phase

on:
  push:
    branches:
      - work/local-bedrock-crates
    paths:
      - '.github/workflows/local-bedrock-second-phase.yml'
      - 'scripts/apply_local_bedrock_world_executor.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/local-bedrock-crates
          fetch-depth: 1
      - name: Apply World executor and partitioned scans
        shell: bash
        run: |
          set +e
          validation=/tmp/second_phase_validation.txt
          : > "$validation"
          echo '=== prepare patch ===' >> "$validation"
          python - <<'PY' >> "$validation" 2>&1
          from pathlib import Path
          path = Path('scripts/apply_local_bedrock_world_executor.py')
          text = path.read_text(encoding='utf-8')
          old = '#[derive(Debug, Clone, Default)]\n/// Options controlling world scan operations.\npub struct WorldScanOptions'
          new = '#[derive(Debug, Clone)]\n/// Options controlling world scan operations.\npub struct WorldScanOptions'
          count = text.count(old)
          if count != 2:
              raise RuntimeError(f'expected two WorldScanOptions patch markers, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          status=$?
          if [ "$status" -eq 0 ]; then
            echo '=== apply world executor ===' >> "$validation"
            python scripts/apply_local_bedrock_world_executor.py >> "$validation" 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            echo '=== legacy API guard ===' >> "$validation"
            if grep -RIn -E 'fn world_pool|TileManifestProbe(Request|Result)|probe_tile_manifest_(blocking|async)' crates/bedrock-world/src crates/bedrock-render/src >> "$validation" 2>&1; then
              echo 'legacy world/renderer API remains' >> "$validation"
              status=1
            fi
          fi
          if [ "$status" -eq 0 ]; then
            echo '=== fmt ===' >> "$validation"
            cargo fmt --all >> "$validation" 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            echo '=== check bedrock-world ===' >> "$validation"
            cargo check --manifest-path crates/bedrock-world/Cargo.toml --all-features >> "$validation" 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            echo '=== test bedrock-world ===' >> "$validation"
            cargo test --manifest-path crates/bedrock-world/Cargo.toml --all-features >> "$validation" 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            echo '=== check bedrock-render ===' >> "$validation"
            cargo check --manifest-path crates/bedrock-render/Cargo.toml --all-features >> "$validation" 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            echo '=== test bedrock-render ===' >> "$validation"
            cargo test --manifest-path crates/bedrock-render/Cargo.toml --all-features >> "$validation" 2>&1
            status=$?
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            cp "$validation" scripts/second_phase_validation.txt
            git add scripts/second_phase_validation.txt
            if ! git diff --cached --quiet; then
              git commit -m 'chore: 记录 World 第二阶段验证失败'
              git push origin HEAD:work/local-bedrock-crates
            fi
            cat "$validation"
            exit "$status"
          fi

          cp "$validation" scripts/second_phase_validation.txt
          git add crates/bedrock-world crates/bedrock-render scripts/second_phase_validation.txt Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m 'perf(world): 使用分区归约与持久执行器'
            git push origin HEAD:work/local-bedrock-crates
          fi
          cat "$validation"
