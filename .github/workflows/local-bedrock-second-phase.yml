name: Local Bedrock second phase

on:
  push:
    branches:
      - work/local-bedrock-crates
    paths:
      - '.github/workflows/local-bedrock-second-phase.yml'
      - 'scripts/apply_local_bedrock_second_phase.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/local-bedrock-crates
          fetch-depth: 1
      - name: Inspect second phase call sites
        shell: bash
        run: |
          set -euo pipefail
          output=scripts/second_phase_inspection.txt
          {
            echo '=== manifest/probe references ==='
            grep -RIn -C 3 -E 'PendingManifest|pending_manifest|manifest_probe|manifest_scanned|tile_manifest' src/ui/window/map_viewer src/ui/window/map_viewer.rs || true
            echo '=== leveldb cache references ==='
            grep -RIn -C 4 -E 'NativeBlockCache|cache_size|index_capacity|open_table_file|invalidate_paths|VecDeque|TableId' crates/bedrock-leveldb/src || true
            echo '=== WAL overlay references ==='
            grep -n -C 5 -E 'approximate_overlay_size|apply_batch|load_existing_or_initialize' crates/bedrock-leveldb/src/db.rs || true
            echo '=== get_many references ==='
            grep -RIn -C 5 -E 'get_many_owned|get_table_entries' crates/bedrock-leveldb/src || true
            echo '=== world executor references ==='
            grep -RIn -C 5 -E 'world_pool|ThreadPoolBuilder|spawn_blocking|WorldExecutor|query_chunk_data_with_stats_blocking' crates/bedrock-world/src crates/bedrock-render/src || true
            echo '=== occupancy/cache references ==='
            grep -RIn -C 5 -E 'TileOccupancy|occupancy|DiskCacheFresh|DiskCacheStale|world_signature' crates/bedrock-render/src src/ui/window/map_viewer || true
          } > "$output"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$output"
          if ! git diff --cached --quiet; then
            git commit -m 'chore: 记录本地 Bedrock 第二阶段调用点'
            git push origin HEAD:work/local-bedrock-crates
          fi
