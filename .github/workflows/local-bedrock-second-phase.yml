name: Local Bedrock second phase

on:
  push:
    branches:
      - work/local-bedrock-crates
    paths:
      - '.github/workflows/local-bedrock-second-phase.yml'
      - 'scripts/fix_bmcbl_occupancy_compile.py'
  workflow_dispatch:

concurrency:
  group: local-bedrock-second-phase-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/local-bedrock-crates
          fetch-depth: 1
      - name: Install desktop build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            libasound2-dev \
            libudev-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libgl1-mesa-dev
      - name: Fix and validate occupancy migration
        shell: bash
        run: |
          set +e
          validation=/tmp/second_phase_validation.txt
          : > "$validation"
          echo '=== fix occupancy compile errors ===' >> "$validation"
          python scripts/fix_bmcbl_occupancy_compile.py >> "$validation" 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            echo '=== legacy API guard ===' >> "$validation"
            if grep -RIn -E 'PendingManifest|pending_manifest|manifest_probe|manifest_scanned|tile_manifest|TileManifest|PROBE_GROUP|fn world_pool|open_with_cache_options|cache_size|occupancy_scanned_tiles|mark_occupancy_tile_empty' src/ui/window/map_viewer src/ui/window/map_viewer.rs crates/bedrock-render/src crates/bedrock-world/src crates/bedrock-leveldb/src >> "$validation" 2>&1; then
              echo 'legacy Bedrock or map API remains' >> "$validation"
              status=1
            fi
          fi
          if [ "$status" -eq 0 ]; then
            echo '=== fmt ===' >> "$validation"
            cargo fmt --all >> "$validation" 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            echo '=== check bedrock-render map features ===' >> "$validation"
            cargo check --manifest-path crates/bedrock-render/Cargo.toml --no-default-features --features 'async,webp,png' >> "$validation" 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            echo '=== check BMCBL library ===' >> "$validation"
            cargo check -p bmcbl --lib >> "$validation" 2>&1
            status=$?
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          cp "$validation" scripts/second_phase_validation.txt
          git add -A src/ui/window/map_viewer crates/bedrock-render scripts/second_phase_validation.txt Cargo.lock
          if [ "$status" -ne 0 ]; then
            if ! git diff --cached --quiet; then
              git commit -m 'wip(map): 修复 occupancy 迁移编译错误'
              git push origin HEAD:work/local-bedrock-crates
            fi
            cat "$validation"
            exit "$status"
          fi

          if ! git diff --cached --quiet; then
            git commit -m 'refactor(map): 完成 occupancy 状态机迁移'
            git push origin HEAD:work/local-bedrock-crates
          fi
          cat "$validation"
