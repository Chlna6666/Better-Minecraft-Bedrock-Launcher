name: Local Bedrock second phase

on:
  push:
    branches:
      - work/local-bedrock-crates
    paths:
      - '.github/workflows/local-bedrock-second-phase.yml'
      - 'scripts/apply_local_bedrock_second_phase_breaking.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/local-bedrock-crates
          fetch-depth: 1
      - name: Remove legacy LevelDB cache APIs and validate
        shell: bash
        run: |
          set +e
          validation=/tmp/second_phase_validation.txt
          : > "$validation"
          echo '=== breaking API cleanup ===' >> "$validation"
          python scripts/apply_local_bedrock_second_phase_breaking.py >> "$validation" 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            echo '=== legacy API guard ===' >> "$validation"
            if grep -RIn -E 'cache_size|open_with_cache_options|from_total' crates/bedrock-leveldb/src crates/bedrock-leveldb/tests >> "$validation" 2>&1; then
              echo 'legacy LevelDB cache API remains' >> "$validation"
              status=1
            fi
          fi
          if [ "$status" -eq 0 ]; then
            echo '=== fmt ===' >> "$validation"
            cargo fmt --all >> "$validation" 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            echo '=== check bedrock-leveldb ===' >> "$validation"
            cargo check --manifest-path crates/bedrock-leveldb/Cargo.toml --all-features >> "$validation" 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            echo '=== test bedrock-leveldb ===' >> "$validation"
            cargo test --manifest-path crates/bedrock-leveldb/Cargo.toml --all-features >> "$validation" 2>&1
            status=$?
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            cp "$validation" scripts/second_phase_validation.txt
            git add scripts/second_phase_validation.txt
            if ! git diff --cached --quiet; then
              git commit -m 'chore: 记录 LevelDB 破坏性接口验证失败'
              git push origin HEAD:work/local-bedrock-crates
            fi
            cat "$validation"
            exit "$status"
          fi

          cp "$validation" scripts/second_phase_validation.txt
          git add crates/bedrock-leveldb scripts/second_phase_validation.txt Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m 'perf(leveldb): 删除旧缓存接口并采用分片配置'
            git push origin HEAD:work/local-bedrock-crates
          fi
          cat "$validation"
