name: Remove obsolete YinQiDao GPUI branch
on:
  push:
    paths:
      - .github/workflows/temporary-remove-inactive-branch.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Delete only the obsolete temporary branch
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin refs/heads/yinqidao-gpui-inactive-60fps >/dev/null; then
            git push origin --delete yinqidao-gpui-inactive-60fps
          fi
