name: Apply map avatar input entity fix once

on:
  push:
    branches:
      - fix/map-avatar-input-entity-icons
    paths:
      - tools/apply-map-avatar-input-entity-fix.py
      - .github/workflows/apply-map-avatar-input-entity-fix-once.yml

permissions:
  contents: write

concurrency:
  group: apply-map-avatar-input-entity-fix-once
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/map-avatar-input-entity-icons
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: map-avatar-input-entity-${{ runner.os }}-rust-1.95-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            player-item-context-v4-${{ runner.os }}-rust-1.95-
            player-workspace-v3-${{ runner.os }}-rust-1.95-

      - name: Apply source patch
        shell: pwsh
        run: python tools/apply-map-avatar-input-entity-fix.py

      - name: Install Rust 1.95
        shell: pwsh
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup component add rustfmt --toolchain 1.95.0
          rustup default 1.95.0

      - name: Format and diff check
        shell: pwsh
        run: |
          rustfmt --edition 2024 `
            src/ui/components/input.rs `
            src/core/minecraft/entity_avatar.rs `
            src/ui/window/map_viewer/canvas.rs `
            src/ui/window/map_viewer/paint.rs `
            src/ui/window/map_viewer/tests.rs
          git diff --check

      - name: Cargo check
        shell: pwsh
        run: cargo check -p bmcbl --lib --message-format short

      - name: Commit validated implementation
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          Remove-Item -Force tools/apply-map-avatar-input-entity-fix.py
          Remove-Item -Force .github/workflows/apply-map-avatar-input-entity-fix-once.yml
          git add -A
          git commit -m "fix(map): correct player avatar and entity icons; add input undo"
          git push origin HEAD:fix/map-avatar-input-entity-icons
