name: Apply Nova RGB Subpixel Migration

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-nova-rgb-subpixel-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'fix/nova-rgb-subpixel'
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v5
        with:
          ref: fix/nova-rgb-subpixel
          fetch-depth: 0

      - name: Apply RGB Subpixel migration
        shell: pwsh
        run: python scripts/patch_nova_rgb_subpixel.py

      - name: Format Rust sources
        shell: pwsh
        run: cargo fmt --all

      - name: Validate patch whitespace
        shell: pwsh
        run: git diff --check

      - name: Commit migration
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) {
            Write-Host 'Migration already applied; nothing to commit.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/gpui crates/nova-gfx
          git commit -m 'fix(gpui): 接入 Windows RGB Subpixel 双源混合'
          git push origin HEAD:fix/nova-rgb-subpixel
