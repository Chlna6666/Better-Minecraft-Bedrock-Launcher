name: GPUI 3D Native MRT Verification

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/gpui3d-native-mrt.yml'
      - 'crates/gpui-3d/src/scene_view.wgsl'
      - 'crates/gpui-3d/src/scene_view/scene/**'
      - 'crates/gpui-3d/src/scene_view/scene.rs'
      - 'crates/gpui-3d/src/scene_view/mesher.wgsl'
      - 'crates/gpui-3d/src/scene_view/voxel.wgsl'
      - 'crates/gpui-3d/src/scene_view/draw_compaction.wgsl'
      - 'crates/gpui/src/diagnostics/performance_metrics/window/native_vsync.rs'
      - 'crates/gpui/src/platform/traits.rs'
      - 'crates/nova-gfx/gfx-vulkan/src/**'
      - 'crates/nova-gfx/gfx-core/src/**'
      - 'crates/nova-gfx/gfx-shader/src/**'
      - 'crates/gpui-3d/src/scene_view/effects/**'
      - 'crates/gpui-3d/src/scene_view/generated_tests.rs'
      - 'crates/gpui-3d/src/scene_view/generated.rs'
      - 'crates/gpui-3d/src/scene_view/culling.rs'
      - 'crates/gpui-3d/src/scene_view/culling_tests.rs'
      - 'crates/nova-gfx/gfx-vulkan/tests/**'

permissions:
  contents: read

concurrency:
  group: gpui3d-native-mrt-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  vulkan-software:
    name: Vulkan / Mesa Lavapipe native pixel verification
    # Desktop nova-gfx requires Vulkan 1.4; Noble ships a 1.3 loader.
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: target/ci-native
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_OPT_LEVEL: "1"
      RUST_MIN_STACK: "67108864"
    steps:
      - uses: actions/checkout@v5
      - name: Install native rendering and Rust build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake libclang-dev llvm-dev ninja-build pkg-config \
            libasound2-dev libdbus-1-dev libegl-dev libfontconfig1-dev \
            libfreetype6-dev libgl-dev libpipewire-0.3-dev libssl-dev \
            libudev-dev libvulkan-dev libwayland-dev libx11-dev libx11-xcb-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb1-dev \
            libxcursor-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxrandr-dev mesa-vulkan-drivers vulkan-tools
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - name: Restore Rust dependency and compiler cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target/ci-native"
          key: native-mrt-v2-ubuntu2604
          cache-on-failure: "true"
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Select the software Vulkan driver
        shell: bash
        run: |
          set -euo pipefail
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$icd"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          echo "Mesa Vulkan ICD: $icd"
      - name: Verify Vulkan 1.4 loader and Lavapipe adapter
        shell: bash
        run: |
          set -euo pipefail
          vulkaninfo --summary | tee "$RUNNER_TEMP/vulkan-summary.txt"
          python3 - "$RUNNER_TEMP/vulkan-summary.txt" <<'PY'
          import re, sys
          info = open(sys.argv[1]).read()
          for label, pattern in [("loader", r"Vulkan Instance Version:\s*(\d+)\.(\d+)"),
                                 ("adapter", r"apiVersion\s*=\s*(\d+)\.(\d+)")]:
              version = re.search(pattern, info)
              if not version or tuple(map(int, version.groups())) < (1, 4):
                  raise SystemExit(f"Vulkan 1.4 required for {label}; check the native CI environment")
          PY
      - name: Compile native backend test suite
        id: native_compile
        run: cargo test -p gpui-3d --lib --features gpui/x11 --no-run
      - name: Verify true nearest-depth Hi-Z SSR hierarchy on Vulkan
        if: ${{ !cancelled() && steps.native_compile.outcome == 'success' }}
        run: cargo test -p gpui-3d --lib --features gpui/x11 ssr_hiz_vulkan -- --ignored --nocapture
      - name: Compare MRT output against legacy Surface and Albedo captures
        if: ${{ !cancelled() && steps.native_compile.outcome == 'success' }}
        run: cargo test -p gpui-3d --lib --features gpui/x11 effects_vulkan -- --ignored --nocapture
      - name: Validate 2D Greedy and uniform-light fallback GPU counts
        if: ${{ !cancelled() && steps.native_compile.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p gpui-3d --lib --features gpui/x11 gpu_mesher_vulkan -- --ignored --list | tee "$RUNNER_TEMP/greedy-tests.txt"
          grep -Fx 'scene_view::generated::tests::gpu_mesher_vulkan: test' "$RUNNER_TEMP/greedy-tests.txt"
          cargo test -p gpui-3d --lib --features gpui/x11 gpu_mesher_vulkan -- --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/greedy-results.txt"
          grep -Fq 'running 1 test' "$RUNNER_TEMP/greedy-results.txt"
      - name: Reject illegal direct MSAA texture readback
        if: ${{ !cancelled() && steps.native_compile.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p gfx-vulkan --test texture_transfer multisampled_texture_readback_requires_explicit_resolve -- --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/msaa-readback.txt"
          grep -Fq 'running 1 test' "$RUNNER_TEMP/msaa-readback.txt"
          if grep -Fq 'NOVA_GFX_SKIP=' "$RUNNER_TEMP/msaa-readback.txt"; then exit 1; fi
      - name: Verify optional Vulkan descriptor indexing and host image copy
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p gfx-vulkan --lib descriptor_indexing_plan_never_enables_unqueried_or_update_after_bind_features
          cargo test -p gfx-vulkan --lib host_copy_budget_caps_whole_batch
          cargo test -p gfx-vulkan --lib native_sparse_descriptor_indexing_allocation -- --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/indexing.txt"
          grep -Fq 'running 1 test' "$RUNNER_TEMP/indexing.txt"
          grep -Fq 'NOVA_VULKAN_DESCRIPTOR_INDEXING_SPARSE=' "$RUNNER_TEMP/indexing.txt"
          cargo test -p gfx-vulkan --lib native_host_copy_first_write_then_staging -- --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/host-copy.txt"
          grep -Fq 'running 1 test' "$RUNNER_TEMP/host-copy.txt"
          grep -Fq 'NOVA_VULKAN_HOST_IMAGE_COPY=' "$RUNNER_TEMP/host-copy.txt"
      - name: Verify native swapchain generation retirement fences
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p gfx-vulkan --lib retirement_tests
          cargo test -p gfx-vulkan --lib native_generation_retirement_waits_for_all_three_fence_classes -- --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/generation-fences.txt"
          grep -Fq 'NOVA_VULKAN_GENERATION_FENCES=pass' "$RUNNER_TEMP/generation-fences.txt"
      - name: Verify immutable sampled descriptor table snapshots
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p gfx-vulkan --lib sampled_table_dirty_spans_are_exact_and_ordered
          cargo test -p gfx-vulkan --lib native_sampled_table_snapshot_preserves_old_slots -- --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/sampled-table.txt"
          grep -Fq 'NOVA_VULKAN_SAMPLED_TABLE=pass' "$RUNNER_TEMP/sampled-table.txt"
      - name: Verify non-uniform descriptor table shader pixels
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p gfx-core --lib sampled_texture_slots::tests
          cargo test -p gfx-vulkan --lib native_sampled_table_shader_reads_nonuniform_slots -- --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/sampled-table-pixels.txt"
          grep -Fq 'NOVA_VULKAN_SAMPLED_TABLE_PIXELS=pass' "$RUNNER_TEMP/sampled-table-pixels.txt"
