name: Apply player workspace v3 once

on:
  push:
    branches: [master]
    paths:
      - tools/.apply-player-workspace-v3-trigger

permissions:
  contents: write

concurrency:
  group: apply-player-workspace-v3-once
  cancel-in-progress: true

jobs:
  integrate-and-validate:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: player-workspace-v3-${{ runner.os }}-rust-1.95-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            player-workspace-v3-${{ runner.os }}-rust-1.95-
            player-overlay-responsive-dnd-${{ runner.os }}-rust-1.95-

      - name: Apply player workspace v3 compile fix
        shell: pwsh
        run: python tools/fix-player-workspace-v3-compile.py

      - name: Install Rust 1.95
        shell: pwsh
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup component add rustfmt --toolchain 1.95.0
          rustup default 1.95.0

      - name: Format changed sources
        shell: pwsh
        run: |
          rustfmt --edition 2024 `
            src/ui/window/map_viewer/player_workspace.rs `
            src/ui/window/map_viewer/players.rs `
            src/ui/window/map_viewer/interactions.rs

      - name: Validate whitespace
        shell: pwsh
        run: git diff --check

      - name: Cargo check
        id: cargo_check
        continue-on-error: true
        shell: pwsh
        run: |
          $log = "tools/player-workspace-v3-validation.log"
          Remove-Item -Force -ErrorAction SilentlyContinue $log
          cargo check -p bmcbl --lib --message-format short *>&1 | Tee-Object -FilePath $log
          exit $LASTEXITCODE

      - name: Publish failure diagnostics
        if: steps.cargo_check.outcome != 'success'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/window/map_viewer tools/player-workspace-v3-validation.log
          git commit -m "ci: apply player workspace v3 compile fix and record failure"
          git push origin HEAD:master

      - name: Commit validated integration and clean one-time files
        if: steps.cargo_check.outcome == 'success'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          Remove-Item -Force tools/.apply-player-workspace-v3-trigger
          Remove-Item -Force tools/apply-player-workspace-v3.py
          Remove-Item -Force tools/fix-player-workspace-v3-compile.py
          Remove-Item -Force tools/player-workspace-v3-validation.log -ErrorAction SilentlyContinue
          Remove-Item -Force .github/workflows/apply-player-workspace-v3-once.yml
          git add -A
          git commit -m "fix(map): stabilize player workspace inventory workflow"
          git push origin HEAD:master

      - name: Fail after publishing diagnostics
        if: steps.cargo_check.outcome != 'success'
        shell: pwsh
        run: exit 1
