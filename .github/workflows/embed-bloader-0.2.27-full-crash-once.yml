name: Embed BLoader 0.2.27 full-crash once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/embed-bloader-0.2.27-full-crash-once.yml

permissions:
  contents: write

jobs:
  embed:
    runs-on: windows-2025
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified BLoader artifact
        shell: pwsh
        run: |
          gh api repos/Chlna6666/BLoader/actions/artifacts/9040723818/zip > bloader-artifact.zip
          Expand-Archive -Path bloader-artifact.zip -DestinationPath bloader-artifact -Force
          $dll = Get-ChildItem bloader-artifact -Recurse -Filter BLoader.dll | Select-Object -First 1
          if (-not $dll) { throw 'BLoader.dll not found in artifact' }
          $hash = (Get-FileHash $dll.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'b8ee018399727b08f64c57989db4dab1fb6b0710875a56cd25b216e0a538869c') {
            throw "Unexpected BLoader.dll SHA256: $hash"
          }
          $version = $dll.VersionInfo.FileVersion
          if (-not $version.StartsWith('0.2.27')) { throw "Unexpected BLoader version: $version" }
          Copy-Item $dll.FullName assets/bin/BLoader.dll -Force
          Write-Host "Embedded BLoader.dll version=$version sha256=$hash"

      - name: Commit binary-only product update and remove workflow
        shell: pwsh
        run: |
          Remove-Item '.github/workflows/embed-bloader-0.2.27-full-crash-once.yml' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/bin/BLoader.dll .github/workflows/embed-bloader-0.2.27-full-crash-once.yml
          git diff --cached --check
          git commit -m 'chore: embed BLoader 0.2.27 full-crash diagnostic'
          git push origin HEAD:master
