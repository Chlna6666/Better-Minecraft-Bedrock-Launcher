name: Apply GPUI truncate width cache fix

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/apply-gpui-truncate-width-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix regression baseline
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/gpui/src/element/text/layout.rs")
          text = path.read_text(encoding="utf-8")
          if "truncate_width: Option<Pixels>" not in text:
              raise SystemExit("truncate width production fix is missing")

          start = text.index("    #[gpui::test]\n    fn text_layout_truncation_remeasures_when_available_width_changes")
          end = text.index("    #[gpui::test]\n    fn fresh_text_element_measures_after_retained_layout_cache_hit", start)
          block = text[start:end]
          if block.count("px(320.)") != 2:
              raise SystemExit(f"expected two 320px wide-baseline values, found {block.count('px(320.)')}")
          block = block.replace("px(320.)", "px(900.)")
          text = text[:start] + block + text[end:]
          path.write_text(text, encoding="utf-8")

      - name: Commit test correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/gpui/src/element/text/layout.rs
          git diff --cached --check
          git diff --cached --quiet && {
            echo 'no truncate regression correction generated' >&2
            exit 1
          }
          git commit -m 'test(gpui): 修正 truncate 宽度回归基线'
          git push origin HEAD:master
