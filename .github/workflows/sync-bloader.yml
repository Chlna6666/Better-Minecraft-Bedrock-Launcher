name: Sync embedded BLoader

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "assets/bin/BLoader.lock"
      - ".github/workflows/sync-bloader.yml"

permissions:
  contents: write

concurrency:
  group: sync-embedded-bloader
  cancel-in-progress: true

jobs:
  sync:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch pinned successful BLoader build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $lockFile = 'assets/bin/BLoader.lock'
          if (-not (Test-Path $lockFile)) {
            Write-Host 'No BLoader.lock; no embed update requested.'
            exit 0
          }
          $entries = @{}
          foreach ($line in Get-Content $lockFile) {
            if ($line -match '^([^=]+)=(.*)$') {
              $entries[$Matches[1].Trim()] = $Matches[2].Trim()
            }
          }
          $version = $entries.version
          $runId = $entries.run_id
          $sourceSha = $entries.source_sha
          $expectedHash = $entries.sha256
          $expectedSize = $entries.size
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or $runId -notmatch '^\d+$' -or
              $sourceSha -notmatch '^[0-9a-f]{40}$' -or
              $expectedHash -notmatch '^[0-9a-f]{64}$' -or
              $expectedSize -notmatch '^\d+$') {
            throw 'BLoader.lock contains invalid pinned version, commit, run, hash, or size'
          }

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'BMCBL-Pinned-BLoader-Sync'
          }
          $repo = 'Chlna6666/BLoader'
          $base = "https://api.github.com/repos/$repo"
          $run = Invoke-RestMethod -Uri "$base/actions/runs/$runId" -Headers $headers
          if ($run.event -ne 'push' -or $run.head_branch -ne 'master' -or
              $run.head_sha -ne $sourceSha -or $run.conclusion -ne 'success') {
            throw 'Pinned BLoader run is not a successful master push for source_sha'
          }

          $artifacts = Invoke-RestMethod -Uri "$base/actions/runs/$runId/artifacts?per_page=100" -Headers $headers
          $artifact = @($artifacts.artifacts | Where-Object {
            $_.name -eq 'BLoader-windows-x64' -and -not $_.expired
          }) | Select-Object -First 1
          if (-not $artifact) { throw 'Pinned BLoader CI artifact is not available' }

          $archive = Join-Path $env:RUNNER_TEMP 'bloader-ci-artifact.zip'
          $directory = Join-Path $env:RUNNER_TEMP 'bloader-ci-extract'
          Invoke-WebRequest -Uri "$base/actions/artifacts/$($artifact.id)/zip" -Headers $headers -OutFile $archive -MaximumRedirection 5
          Expand-Archive -Path $archive -DestinationPath $directory -Force
          $dll = Join-Path $directory 'target/x86_64-pc-windows-msvc/release/BLoader.dll'
          $hashFile = Join-Path $directory "dist/BLoader-$version-windows-x64/BLoader.dll.sha256"
          $manifestFile = Join-Path $directory "dist/BLoader-$version-windows-x64/manifest.json"
          if (!(Test-Path $dll) -or !(Test-Path $hashFile) -or !(Test-Path $manifestFile)) {
            throw 'BLoader artifact layout or version is unexpected'
          }
          $manifest = Get-Content $manifestFile -Raw | ConvertFrom-Json
          $actualHash = (Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant()
          $publishedHash = ((Get-Content $hashFile -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actualSize = (Get-Item $dll).Length
          if ($expectedHash -ne $actualHash -or $actualHash -ne $publishedHash -or
              $actualSize -ne [long]$expectedSize) {
            throw 'Pinned BLoader DLL SHA-256 or file size mismatch'
          }
          if ($manifest.version -and $manifest.version -ne $version) {
            throw 'Pinned BLoader manifest version mismatch'
          }
          Copy-Item $dll 'assets/bin/BLoader.dll' -Force
          Write-Host "Embedded BLoader $version from $sourceSha (CI run $runId), SHA-256=$actualHash"

      - name: Commit updated embedded DLL
        shell: pwsh
        run: |
          if (!(Test-Path assets/bin/BLoader.lock)) { exit 0 }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/bin/BLoader.dll
          if (git diff --cached --quiet) {
            Write-Host 'Embedded BLoader already matches the pinned artifact.'
            exit 0
          }
          $version = ((Get-Content assets/bin/BLoader.lock | Where-Object {
            $_ -like 'version=*'
          } | Select-Object -First 1) -split '=', 2)[1]
          git commit -m "chore: embed verified BLoader $version"
          git pull --rebase origin master
          git push origin HEAD:master
