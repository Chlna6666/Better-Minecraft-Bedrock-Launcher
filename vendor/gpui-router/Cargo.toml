# BMCBL vendored adaptation of gpui-router 0.5.0.
# Upstream: https://github.com/justjavac/gpui-router/tree/v0.5.0/crates/router
# Keep gpui default features disabled: BMCBL selects renderer/platform features itself.

[package]
edition = "2024"
name = "gpui-router"
version = "0.5.0"
authors = ["迷渡 <justjavac@gmail.com>"]
build = false
publish = true
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A router for GPUI App."
homepage = "https://github.com/justjavac/gpui-router"
documentation = "https://docs.rs/gpui-router"
readme = "README.md"
keywords = ["gpui", "router", "ui", "framework"]
categories = ["gui"]
license = "MIT"
repository = "https://github.com/justjavac/gpui-router"
resolver = "2"

[features]
default = ["gpui", "font-kit", "wayland", "x11"]
gpui = ["dep:gpui"]
gpui-pre = ["dep:gpui-pre"]
test-support = ["gpui?/test-support", "gpui-pre?/test-support"]
inspector = ["gpui?/inspector", "gpui-pre?/inspector"]
leak-detection = ["gpui?/leak-detection", "gpui-pre?/leak-detection"]
wayland = ["gpui?/wayland", "gpui-pre?/wayland"]
x11 = ["gpui?/x11", "gpui-pre?/x11"]
screen-capture = ["gpui?/scap", "gpui-pre?/screen-capture"]
font-kit = ["gpui?/font-kit"]
macos-blade = ["gpui?/macos-blade"]
runtime_shaders = ["gpui?/runtime_shaders"]

[lib]
name = "gpui_router"
path = "src/lib.rs"
doctest = false

[[example]]
name = "basic"
path = "examples/basic.rs"
required-features = ["gpui"]

[[example]]
name = "nested_router"
path = "examples/nested_router.rs"
required-features = ["gpui"]

[[example]]
name = "params"
path = "examples/params.rs"
required-features = ["gpui"]

[[example]]
name = "sub_router"
path = "examples/sub_router.rs"
required-features = ["gpui"]

[dependencies.gpui]
version = "0.2.1"
optional = true
default-features = false

[dependencies.gpui-pre]
package = "gpui-pre"
version = "0.3.6"
optional = true
default-features = false

[dependencies.gpui-router-macros]
version = "0.4.0"

[dependencies.hashbrown]
version = "0.16.0"

[dependencies.matchit]
version = "0.8.6"

[dependencies.smallvec]
version = "1.15.1"

[dev-dependencies.gpui]
version = "0.2.1"
features = ["test-support"]
default-features = false
