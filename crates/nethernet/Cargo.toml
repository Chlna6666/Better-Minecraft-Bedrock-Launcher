[package]
name = "nethernet"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.85"
description = "Minecraft 基岩版 NetherNet（WebRTC）传输的 Rust 实现"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dependencies]
aes = "0.8.4"
base64 = "0.22.1"
bytes = "1.10.1"
hmac = "0.12.1"
p384 = { version = "0.13.1", features = ["ecdsa", "pkcs8"] }
rand = "0.10.0"
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["rt", "net", "sync", "time"] }
tokio-util = { version = "0.7.17", features = ["rt"] }
tracing = "0.1.43"
webrtc = "0.17.2"

[dev-dependencies]
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
