[package]
name = "gpui_tokio"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"

[lib]
path = "src/gpui_tokio.rs"
doctest = false

[dependencies]
anyhow = "1.0.100"
gpui = { path = "../gpui", default-features = false }
gpui_util = "0.2.2"
tokio = { version = "1.48.0", features = ["rt", "rt-multi-thread"] }

[dev-dependencies]
gpui = { path = "../gpui", default-features = false, features = ["test-support"] }
