[package]
name = "egpui-build"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Deterministic manifest, resource and bundle planning for egpui applications"
homepage = "https://github.com/Chlna6666/Better-Minecraft-Bedrock-Launcher"
repository = "https://github.com/Chlna6666/Better-Minecraft-Bedrock-Launcher"
license = "Apache-2.0"
readme = "README.md"
keywords = ["desktop", "application", "packaging", "resources"]
categories = ["development-tools::build-utils"]

[lib]
name = "egpui_build"
path = "src/egpui_build.rs"
doctest = false

[dependencies]
egpui-manifest = { path = "../egpui-manifest" }
hex = "0.4.3"
schemars = "1.1.0"
serde_json = "1.0.145"
sha2 = "0.11.0"
thiserror = "2.0.17"
toml = "1.1.2"
walkdir = "2.5.0"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
