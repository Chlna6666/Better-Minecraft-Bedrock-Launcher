[package]
name = "bedrock-voxel"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
description = "Image and OBJ conversion into Bedrock block placement plans"

[features]
default = ["simd"]
simd = ["dep:fearless_simd"]

[dependencies]
bedrock-world = { path = "../bedrock-world", version = "0.7.0", default-features = false }
image = { version = "0.25.6", default-features = false, features = ["jpeg", "png", "tga"] }
fearless_simd = { workspace = true, optional = true }
rayon = "1.11.0"
tobj = "4.0.3"

[build-dependencies]
serde_json = "1.0"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
