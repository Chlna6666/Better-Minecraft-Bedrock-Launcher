[package]
name = "bmcbl_plugin_runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
description = "BMCBL WASM 组件插件运行时：wasmtime(Cranelift) 引擎、沙箱与宿主能力门禁"

[dependencies]
anyhow = "1.0.100"
sha2 = "0.11.0"
tracing = "0.1"
url = "2.5.8"
wasmtime = { version = "49", default-features = false, features = ["anyhow", "cache", "component-model", "cranelift", "parallel-compilation", "runtime", "std"] }
wasmtime-wasi = { version = "49", default-features = false, features = ["p2"] }

[dev-dependencies]
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
tempfile = "3.23.0"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
