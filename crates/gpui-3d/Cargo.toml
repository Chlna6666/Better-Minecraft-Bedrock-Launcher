[package]
name = "gpui-3d"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
description = "Scene, mesh, camera, material, and query primitives for GPUI 3D extensions"

[lib]
name = "gpui_3d"
path = "src/lib.rs"

[features]
default = []
# Optional CPU-only importers, without pulling them into every GPUI-3D consumer.
asset-import = ["dep:three-d-asset"]
nova-gfx-opengl = ["gpui/nova-gfx-opengl"]
nova-gfx-dx11 = ["gpui/nova-gfx-dx11"]
nova-gfx-dx12 = ["gpui/nova-gfx-dx12"]
nova-gfx-vulkan = ["gpui/nova-gfx-vulkan"]
nova-gfx-metal = ["gpui/nova-gfx-metal"]
native = ["nova-gfx-opengl", "nova-gfx-dx11", "nova-gfx-dx12", "nova-gfx-vulkan"]

[dependencies]
anyhow = "1.0.100"
base64 = "0.23.0"
bevy_mikktspace = "0.16.1"
gfx-core = { path = "../nova-gfx/gfx-core" }
gpui = { path = "../gpui", default-features = false }
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
three-d-asset = { version = "=0.10.0", default-features = false, features = ["obj", "stl", "png", "jpeg", "tga", "webp"], optional = true }

# Compiles the scene-view and offscreen-renderer WGSL into embedded backend artifacts, so
# creating a renderer never runs the WGSL frontend or the Direct3D compiler.
[build-dependencies.gfx-shader-build]
path = "../nova-gfx/gfx-shader-build"

[[bench]]
name = "raycast"
harness = false

[[bench]]
name = "scene"
harness = false

[[example]]
name = "scene_view"
required-features = ["native"]

[[example]]
name = "scene_lab"
path = "examples/scene_lab/main.rs"

[dev-dependencies]
criterion = "0.5"
gfx-core = { path = "../nova-gfx/gfx-core" }
# The shader translation test drives the WGSL frontend directly; production shaders come from
# build-generated artifacts.
gfx-shader = { path = "../nova-gfx/gfx-shader" }

[target.'cfg(windows)'.dev-dependencies]
gfx-dx11 = { path = "../nova-gfx/gfx-dx11" }
gfx-dx12 = { path = "../nova-gfx/gfx-dx12" }
gfx-vulkan = { path = "../nova-gfx/gfx-vulkan" }
gfx-opengl = { path = "../nova-gfx/gfx-opengl" }
raw-window-handle = "0.6"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dev-dependencies]
gfx-vulkan = { path = "../nova-gfx/gfx-vulkan" }
gfx-opengl = { path = "../nova-gfx/gfx-opengl" }
raw-window-handle = "0.6"

[lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[lints.rustdoc]
broken_intra_doc_links = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
