# Verified glTF test assets for gpui-3d.
#
# Every asset is downloaded exactly once by download.ps1, verified against the pinned SHA-256,
# and then reused offline. A missing or mismatched file is a hard error in the downloader, so
# tests never silently pass without the real asset.
#
# Source: KhronosGroup/glTF-Sample-Assets (https://github.com/KhronosGroup/glTF-Sample-Assets)
# Only assets with CC0 or CC BY licenses are used; attribution is recorded per entry and in
# licenses/.

schema = 1
source_repository = "https://github.com/KhronosGroup/glTF-Sample-Assets"

[[asset]]
name = "DamagedHelmet"
cache_path = "DamagedHelmet.glb"
source_url = "https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/DamagedHelmet/glTF-Binary/DamagedHelmet.glb"
sha256 = "a1e3b04de97b11de564ce6e53b95f02954a297f0008183ac63a4f5974f6b32d8"
bytes = 3773916
license = "CC-BY-4.0"
attribution = "Damaged Helmet, copyright 2018 ctxwing, Creative Commons Attribution 4.0 International"
features = ["glb", "pbr-metallic-roughness", "base-color-texture", "normal-map", "occlusion-map", "metallic-roughness-texture"]

