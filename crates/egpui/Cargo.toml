[package]
name = "egpui"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Application framework and runtime host for the egpui desktop stack"
homepage = "https://github.com/Chlna6666/Better-Minecraft-Bedrock-Launcher"
repository = "https://github.com/Chlna6666/Better-Minecraft-Bedrock-Launcher"
license = "Apache-2.0"
readme = "README.md"
keywords = ["desktop", "application", "gui", "async"]
categories = ["gui"]

[lib]
name = "egpui"
path = "src/egpui.rs"
doctest = false

[dependencies]
anyhow = "1.0.100"
egpui-manifest = { path = "../egpui-manifest" }
fluent-bundle = "0.16.0"
futures-util = "0.3.31"
gpui = { path = "../gpui" }
rayon = "1.11.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.16", features = ["rt"] }
unic-langid = "0.9.6"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
