[package]
name = "bedrock-scene"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
description = "CPU-side scene construction for Minecraft Bedrock worlds and structures"

[features]
test-support = []

[dependencies]
bedrock-block-model = { path = "../bedrock-block-model" }
bedrock-map-render = { path = "../bedrock-map-render", default-features = false }
bedrock-world = { path = "../bedrock-world", default-features = false }
gpui_3d = { path = "../gpui/gpui_3d", default-features = false }
indexmap = "2.12.1"
rayon = "1.11.0"
rustc-hash = "2"

[dev-dependencies]
bedrock-voxel = { path = "../bedrock-voxel" }
serde_json = "1.0"
