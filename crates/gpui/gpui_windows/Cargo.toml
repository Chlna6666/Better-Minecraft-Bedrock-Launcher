[package]
name = "gpui_windows"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[target.'cfg(target_os = "windows")'.dependencies]
anyhow = "1"
cursor-icon = "1.2"
dpi = "0.1"
futures = "0.3"
log = "0.4"
async-task = "4"
collections = { version = "0.2.2", package = "gpui_collections" }
flume = "0.12"
gpui = { path = "../gpui", default-features = false }
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
itertools = "0.14"
parking_lot = "0.12"
slotmap = "1"
smallvec = "1.15"
unicode-segmentation = "1"
uuid = { version = "1", features = ["v4"] }
util = { version = "0.2.2", package = "gpui_util" }
windows-core = "0.62.2"
windows-numerics = "0.3.1"
windows-registry = "0.6.1"
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.62.2"
features = [
    "Foundation_Numerics",
    "Storage_Search",
    "Storage_Streams",
    "System_Threading",
    "UI_ViewManagement",
    "Wdk_System_SystemServices",
    "Win32_Globalization",
    "Win32_Media",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Hlsl",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
]

# Native residency lab compiles experimental SM5 shaders; production shaders remain precompiled.

[features]
test-support = ["gpui/test-support"]

[lints.rust]
unsafe_code = "warn"
