[package]
name = "gpui_windows"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[target.'cfg(target_os = "windows")'.dependencies]
anyhow = "1"
futures = "0.3"
log = "0.4"
windows = { version = "0.62.2", features = [
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unsafe_code = "warn"
