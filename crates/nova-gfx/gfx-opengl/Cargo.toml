[package]
name = "gfx-opengl"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0"
description = "OpenGL backend for nova-gfx"
readme = "README.md"
documentation = "https://docs.rs/gfx-opengl"
keywords = ["graphics", "gpu", "opengl", "rendering", "backend"]
categories = ["rendering::graphics-api"]
include = ["src/**", "Cargo.toml", "README.md", "README.zh-CN.md"]

[lib]
path = "src/gfx_opengl.rs"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dependencies]
gfx-core = { version = "0.1.0", path = "../gfx-core" }
glow = "0.16.0"
raw-window-handle = "0.6"
log = "0.4.29"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
glutin = { version = "0.32.3", default-features = false, features = ["wgl"] }

[target.'cfg(target_os = "linux")'.dependencies]
glutin = { version = "0.32.3", default-features = false, features = ["egl", "x11", "wayland"] }

[dev-dependencies]
gfx-shader = { path = "../gfx-shader" }
